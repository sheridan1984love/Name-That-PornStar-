<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Add Hearts</title>
    <style>
        @font-face {
            font-family: 'LocalBubble';
            src: url('Menu/bubble.ttf') format('truetype');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100vh;
            background-color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: 'LocalBubble', sans-serif;
        }

        .container {
            text-align: center;
        }

        .add-btn {
            padding: 20px 40px;
            font-family: 'LocalBubble', sans-serif;
            font-size: 2vw;
            font-weight: bold;
            color: #FFFFFF;
            background: linear-gradient(135deg, #FF69B4, #C71585);
            border: 3px solid #C71585;
            border-radius: 15px;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .add-btn:active {
            transform: scale(0.9);
        }

        .message {
            color: #FFB6C1;
            font-family: 'LocalBubble', sans-serif;
            font-size: 1.5vw;
            margin-top: 20px;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .message.show {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="container">
        <button class="add-btn" id="addBtn">Add 50M Hearts</button>
        <div class="message" id="message">Done! +50M</div>
    </div>

    <script>
        const addBtn = document.getElementById('addBtn');
        const message = document.getElementById('message');

        addBtn.addEventListener('click', function() {
            const currentHearts = parseInt(localStorage.getItem('moc_count')) || 0;
            const newTotal = currentHearts + 50000000;
            localStorage.setItem('moc_count', newTotal);
            
            message.classList.add('show');
            setTimeout(() => {
                message.classList.remove('show');
            }, 2000);
        });
    </script>
</body>
</html>
