<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>more</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-user-drag: none;
            touch-action: pan-x pan-y;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        body {
            width: 100vw;
            height: 100vh;
            background-color: #FFC0CB;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Fredoka', sans-serif;
        }

        .game-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
            background-color: #FFC0CB;
        }

        .bg-particle {
            position: absolute;
            pointer-events: none;
            z-index: 1;
            animation: floatUpParticle linear forwards;
            opacity: 0;
        }

        @keyframes floatUpParticle {
            0% { opacity: 0; transform: translateY(0) rotate(0deg) scale(0); }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { opacity: 0; transform: translateY(-100vh) rotate(360deg) scale(1); }
        }

        .top-center-image {
            position: absolute;
            top: 3%;
            left: 50%;
            transform: translateX(-50%);
            width: 30%;
            height: auto;
            object-fit: contain;
            z-index: 20;
        }

        .center-image {
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 30%;
            max-width: 200px;
            height: auto;
            object-fit: contain;
            z-index: 15;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .center-image:active {
            transform: translate(-50%, -50%) scale(0.95);
        }

        .profile-box {
            position: absolute;
            top: 3%;
            right: 3%;
            display: flex;
            align-items: center;
            gap: 0;
            z-index: 25;
        }

        .profile-info-box {
            background-color: #C71585;
            border-radius: 20px 0 0 20px;
            padding: 10px 25px 10px 15px;
            margin-right: -15px;
            z-index: 1;
        }

        .profile-name {
            font-family: 'Fredoka', sans-serif;
            font-size: 14px;
            font-weight: 700;
            color: #FFFFFF;
            white-space: nowrap;
        }

        .profile-avatar {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            object-fit: cover;
            z-index: 2;
        }

        .progress-static-wrapper {
            position: absolute;
            bottom: 15%;
            left: 50%;
            transform: translateX(-50%);
            width: 65%;
            height: 10vh;
            z-index: 10;
        }

        .progress-track {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: transparent;
            border-radius: 50px; 
            border: 3px solid #800040; 
            padding: 3px;
        }

        .progress-inner-bg {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: #FFC0CB;
            border-radius: 50px;
            overflow: hidden;
        }

        .progress-fill {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 0%;
            background-color: #C71585;
            border-radius: 50px;
            transition: width 0.3s ease;
        }

        .item-icon-top {
            position: absolute;
            bottom: 100%;
            margin-bottom: 6px;
            width: 30px;
            height: 30px;
            transform: translateX(-50%);
            object-fit: contain;
            z-index: 3;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .item-icon-top:active {
            transform: translateX(-50%) scale(1.2);
        }

        .item-icon-top.claimed {
            opacity: 0.5;
            filter: grayscale(100%);
            cursor: default;
        }

        .item-icon-top.reward-ready {
            animation: iconPulse 0.8s ease-in-out infinite;
        }

        @keyframes iconPulse {
            0%, 100% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.3); }
        }

        .level-label-bottom {
            position: absolute;
            top: 100%;
            margin-top: 8px;
            transform: translateX(-50%);
            font-family: 'Fredoka', sans-serif;
            font-size: 10px;
            font-weight: 700;
            color: #800040;
            white-space: nowrap;
            z-index: 5;
        }

        .reward-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .reward-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .reward-claim-container {
            position: relative;
            width: 40vw;
            height: 40vw;
            max-width: 300px;
            max-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .reward-claim-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            object-fit: contain;
            animation: rotateClaim 8s linear infinite;
        }

        @keyframes rotateClaim {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .reward-claim-text {
            position: relative;
            z-index: 1;
            color: #FFFFFF;
            font-family: 'Fredoka', sans-serif;
            font-size: 2.5vw;
            font-weight: bold;
            padding: 3% 8%;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .reward-claim-text img {
            width: 3vw;
            height: 3vw;
            max-width: 30px;
            max-height: 30px;
            object-fit: contain;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="game-wrapper" id="game-container">
        <img src="https://i.ibb.co/rRBcyHSZ/logo.png" alt="Top Image" class="top-center-image">

        <img src="https://i.ibb.co/8nQY7mL4/Download.png" alt="Center Image" class="center-image" onclick="window.open('https://porn69fans.itch.io/fap-from-the-past-clicker', '_blank')">

        <div class="profile-box" id="profileBox">
            <div class="profile-info-box">
                <div class="profile-name" id="profileName">User</div>
            </div>
            <img class="profile-avatar" id="profileAvatar" src="Menu/sing.png" alt="Avatar">
        </div>

        <div class="progress-static-wrapper">
            <div class="progress-track">
                <div class="progress-inner-bg">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <img src="https://i.ibb.co/ZR0D3pKX/Box.png" class="item-icon-top" style="left: 10%;" data-level="10" data-reward="10000000">
                <img src="https://i.ibb.co/ZR0D3pKX/Box.png" class="item-icon-top" style="left: 20%;" data-level="20" data-reward="20000000">
                <img src="https://i.ibb.co/ZR0D3pKX/Box.png" class="item-icon-top" style="left: 30%;" data-level="30" data-reward="50000000">
                <img src="https://i.ibb.co/ZR0D3pKX/Box.png" class="item-icon-top" style="left: 40%;" data-level="40" data-reward="100000000">
                <img src="https://i.ibb.co/ZR0D3pKX/Box.png" class="item-icon-top" style="left: 50%;" data-level="50" data-reward="150000000">
                <img src="https://i.ibb.co/ZR0D3pKX/Box.png" class="item-icon-top" style="left: 60%;" data-level="60" data-reward="200000000">
                <img src="https://i.ibb.co/ZR0D3pKX/Box.png" class="item-icon-top" style="left: 70%;" data-level="70" data-reward="250000000">
                <img src="https://i.ibb.co/ZR0D3pKX/Box.png" class="item-icon-top" style="left: 80%;" data-level="80" data-reward="300000000">
                <img src="https://i.ibb.co/ZR0D3pKX/Box.png" class="item-icon-top" style="left: 90%;" data-level="90" data-reward="400000000">
                <img src="https://i.ibb.co/ZR0D3pKX/Box.png" class="item-icon-top" style="left: 100%;" data-level="100" data-reward="500000000">

                <span class="level-label-bottom" style="left: 10%;">Lv.10</span>
                <span class="level-label-bottom" style="left: 20%;">Lv.20</span>
                <span class="level-label-bottom" style="left: 30%;">Lv.30</span>
                <span class="level-label-bottom" style="left: 40%;">Lv.40</span>
                <span class="level-label-bottom" style="left: 50%;">Lv.50</span>
                <span class="level-label-bottom" style="left: 60%;">Lv.60</span>
                <span class="level-label-bottom" style="left: 70%;">Lv.70</span>
                <span class="level-label-bottom" style="left: 80%;">Lv.80</span>
                <span class="level-label-bottom" style="left: 90%;">Lv.90</span>
                <span class="level-label-bottom" style="left: 100%;">Lv.100</span>
            </div>
        </div>

        <div class="reward-overlay" id="rewardOverlay">
            <div class="reward-claim-container">
                <img class="reward-claim-bg" src="https://i.ibb.co/bgNWfkhs/sunny.png" alt="Rotating">
                <div class="reward-claim-text" id="rewardClaimText">
                    +10M <img src="https://i.ibb.co/LXmVYXGy/heart.png" alt="Heart">
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        ['copy', 'cut', 'paste', 'dragstart', 'drop'].forEach(eventType => {
            document.addEventListener(eventType, (e) => e.preventDefault());
        });

        document.addEventListener('touchstart', function(e) {
            if (e.touches.length > 1) e.preventDefault();
        }, { passive: false });

        let lastTouchEnd = 0;
        document.addEventListener('touchend', function(e) {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) e.preventDefault();
            lastTouchEnd = now;
        }, false);

        const firebaseConfig = {
            apiKey: atob("QUl6YVN5QWgxd01xTXplX0J1Q01CbFRmcG16X2VOMWVjbTliSEFj"),
            authDomain: atob("bmFtZXRoYXRwb3Juc3RhcjE4LmZpcmViYXNlYXBwLmNvbQ=="),
            projectId: atob("bmFtZXRoYXRwb3Juc3RhcjE4"),
            storageBucket: atob("bmFtZXRoYXRwb3Juc3RhcjE4LmZpcmViYXNlc3RvcmFnZS5hcHA="),
            messagingSenderId: atob("NjIzNTE1MTgzNzEx"),
            appId: atob("MTo2MjM1MTUxODM3MTE6d2ViOmFmNjMzOTVhOTgyYTA3NTBiZjQ5ZWE=")
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let ssLevelFromServer = 0;
        let particlesInterval = null;

        function createParticle() {
            const particle = document.createElement('div');
            particle.className = 'bg-particle';

            const icons = ['https://i.ibb.co/LXmVYXGy/heart.png', 'https://i.ibb.co/LXmVYXGy/heart.png'];
            const icon = icons[Math.floor(Math.random() * icons.length)];

            particle.innerHTML = `<img src="${icon}" style="width:100%;height:100%;object-fit:contain;">`;
            particle.style.left = Math.random() * 90 + '%';
            particle.style.bottom = '-30px';
            particle.style.width = (10 + Math.random() * 20) + 'px';
            particle.style.height = particle.style.width;
            particle.style.animationDuration = (6 + Math.random() * 8) + 's';

            document.getElementById('game-container').appendChild(particle);

            setTimeout(() => particle.remove(), 14000);
        }

        function startParticles() {
            if (particlesInterval) clearInterval(particlesInterval);
            particlesInterval = setInterval(createParticle, 2000);
            for (let i = 0; i < 5; i++) {
                setTimeout(createParticle, i * 400);
            }
        }

        function setProgress(percent) {
            const fill = document.getElementById('progressFill');
            const clamped = Math.min(100, Math.max(0, percent));
            fill.style.width = clamped + '%';
        }

        async function fetchSSLevelFromServer() {
            const username = localStorage.getItem('ss_username') || localStorage.getItem('moc_username');
            if (!username) return 0;
            try {
                const qs = await db.collection('players').where('name', '==', username).get();
                if (!qs.empty) {
                    const data = qs.docs[0].data();
                    return (data.ss_level || 0) + 1;
                }
            } catch(e) {}
            return (parseInt(localStorage.getItem('ss_last_index')) || 0) + 1;
        }

        function updateProfile() {
            const username = localStorage.getItem('ss_username') || localStorage.getItem('moc_username') || 'User';
            const avatar = localStorage.getItem('ss_avatar') || localStorage.getItem('moc_avatar');

            document.getElementById('profileName').textContent = username;

            if (avatar && avatar !== 'null' && avatar !== '') {
                document.getElementById('profileAvatar').src = avatar;
            }
        }

        function formatNum(num) {
            if (num >= 1000000000) return (num / 1000000000).toFixed(1) + 'B';
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num.toString();
        }

        function claimReward(amount, level) {
            const overlay = document.getElementById('rewardOverlay');
            const claimText = document.getElementById('rewardClaimText');

            claimText.innerHTML = '+' + formatNum(amount) + ' <img src="https://i.ibb.co/LXmVYXGy/heart.png" style="width:3vw;height:3vw;max-width:30px;max-height:30px;object-fit:contain;">';
            overlay.classList.add('active');

            const currentHearts = parseInt(localStorage.getItem('moc_count')) || 0;
            localStorage.setItem('moc_count', currentHearts + amount);

            const claimed = JSON.parse(localStorage.getItem('moc_coop_claimed') || '[]');
            claimed.push(level);
            localStorage.setItem('moc_coop_claimed', JSON.stringify(claimed));

            updateRewardIcons();

            setTimeout(() => {
                overlay.classList.remove('active');
            }, 3500);
        }

        function updateRewardIcons() {
            const claimed = JSON.parse(localStorage.getItem('moc_coop_claimed') || '[]');
            const icons = document.querySelectorAll('.item-icon-top');

            icons.forEach(icon => {
                const level = parseInt(icon.dataset.level);
                icon.classList.remove('claimed', 'reward-ready');

                if (claimed.includes(level)) {
                    icon.classList.add('claimed');
                    icon.onclick = null;
                } else if (ssLevelFromServer >= level) {
                    icon.classList.add('reward-ready');
                    icon.onclick = function() {
                        claimReward(parseInt(icon.dataset.reward), level);
                    };
                } else {
                    icon.onclick = null;
                }
            });
        }

        async function updateFromServer() {
            ssLevelFromServer = await fetchSSLevelFromServer();
            const progress = Math.min(100, ssLevelFromServer);
            setProgress(progress);
            updateRewardIcons();
        }

        setInterval(() => {
            updateFromServer();
            updateProfile();
        }, 5000);

        updateFromServer();
        updateProfile();
        startParticles();
    </script>
</body>
</html>
