<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Screen</title>
    <style>
        /* Basic Page Setup */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* Pushes everything to the bottom */
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            overflow: hidden;
        }

        /* Bottom Wrapper: Contains Text, Progress Bar, and Image */
        .bottom-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Loading Text */
        .loading-text {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Progress Bar Container */
        .progress-bar {
            width: 90%; /* Width relative to screen */
            max-width: 500px;
            height: 3px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            margin-bottom: 15px;
            overflow: hidden;
        }

        /* Animated Progress Fill */
        .progress-fill {
            height: 100%;
            width: 0%;
            background-color: #ffffff;
            box-shadow: 0 0 10px #ffffff;
            animation: loadProgress 4s infinite linear;
        }

        @keyframes loadProgress {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        /* Image Styling */
        .image-container {
            width: 100%;
            line-height: 0;
        }

        .image-container img {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

    <div class="bottom-wrapper">
        <div class="loading-text">PLEASE WAIT... LOADING</div>
        
        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>

        <div class="image-container">
            <img src="Big Tits 3D.gif" alt="Content">
        </div>
    </div>

</body>
</html>
