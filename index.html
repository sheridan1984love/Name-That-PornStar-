<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Alanna Pow Puzzle</title>
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        body {
            background-color: #FFC107;
            font-family: 'Comic Neue', 'Jua', sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 16px;
            position: relative;
        }

        .back-button {
            position: fixed;
            top: 16px;
            left: 16px;
            width: 50px;
            height: 50px;
            cursor: pointer;
            transition: transform 0.1s ease;
            z-index: 100;
        }

        .back-button:active {
            transform: scale(0.9);
        }

        .game-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        .game-header img {
            width: 50px;
            height: 50px;
            display: block;
            object-fit: contain;
        }

        .game-header h3 {
            color: #fff;
            text-shadow: 2px 2px 0 #000;
            font-size: 1.4rem;
            margin: 0;
            background: transparent;
            padding: 0;
            border-radius: 0;
            backdrop-filter: none;
            font-family: 'Jua', 'Comic Neue', sans-serif;
            letter-spacing: 1px;
        }

        #board {
            display: grid;
            grid-template-columns: repeat(4, min(85px, 20vw));
            grid-template-rows: repeat(4, min(85px, 20vw));
            gap: 1px;
            background: #fff;
            border: 3px solid #fff;
            margin-bottom: 20px;
            transition: gap 0.2s ease;
        }

        @media (min-width: 500px) {
            #board {
                grid-template-columns: repeat(4, min(100px, 12vw));
                grid-template-rows: repeat(4, min(100px, 12vw));
            }
        }

        #board.no-gaps {
            gap: 0px;
        }

        .slot {
            width: 100%;
            height: 100%;
            background: #fff;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: background 0.1s ease;
            border: none;
            outline: none;
        }

        .slot.drag-over {
            background: rgba(255,255,255,0.3);
            border: 2px solid #fff;
        }

        .piece-container {
            width: 100%;
            height: 100%;
            overflow: hidden;
            cursor: grab;
            position: relative;
            user-select: none;
            touch-action: none;
            box-sizing: border-box;
            background: #FFC107;
        }

        .piece-container:active {
            cursor: grabbing;
        }

        .piece-image-slice {
            width: 100%;
            height: 100%;
            background-size: 340px 340px;
            background-repeat: no-repeat;
            pointer-events: none;
            position: absolute;
            top: 0;
            left: 0;
        }

        .toast-message {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #FFA000;
            color: #FFFFFF;
            padding: 8px 20px;
            z-index: 10001;
            font-weight: bold;
            font-family: 'Comic Neue', 'Jua', sans-serif;
            text-align: center;
            white-space: nowrap;
            border-radius: 10px;
            letter-spacing: 0.5px;
            animation: toastPopIn 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
        }

        @keyframes toastPopIn {
            0% {
                opacity: 0;
                transform: translateX(-50%) scale(0.7);
            }
            70% {
                opacity: 1;
                transform: translateX(-50%) scale(1.05);
            }
            100% {
                opacity: 1;
                transform: translateX(-50%) scale(1);
            }
        }

        .toast-message.fade-out {
            animation: toastFadeOut 0.2s ease-out forwards;
        }

        @keyframes toastFadeOut {
            0% {
                opacity: 1;
                transform: translateX(-50%) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateX(-50%) scale(0.8);
            }
        }

        .sunny-popup {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #FFC107;
            z-index: 10000;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .sunny-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 300%;
            height: 300%;
            transform: translate(-50%, -50%);
            background: repeating-conic-gradient(from 0deg, rgba(255,255,255,0.3) 0deg 10deg, transparent 10deg 20deg);
            animation: sunnySpin 20s linear infinite;
        }

        @keyframes sunnySpin {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .sunny-box {
            position: relative;
            z-index: 2;
            background: white;
            width: 200px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            border-radius: 20px;
        }

        .sunny-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 16px;
        }

        .sunny-text {
            position: relative;
            z-index: 2;
            color: white;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 20px;
            font-family: 'Jua', 'Comic Neue', sans-serif;
            text-shadow: 3px 3px 0 #000;
            text-align: center;
            background: transparent;
            padding: 8px 20px;
            border-radius: 0px;
            letter-spacing: 1px;
        }

        .gift-section {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
        }

        .gift-label {
            font-size: 18px;
            font-weight: bold;
            color: #FFFFFF;
            font-family: 'Jua', 'Comic Neue', sans-serif;
            text-shadow: 2px 2px 0 #000;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .gift-code-box {
            background-color: #E65100;
            padding: 14px 22px;
            border-radius: 4px;
            cursor: pointer;
            transition: transform 0.1s ease, background-color 0.1s ease;
            border: 2px solid #FFFFFF;
        }

        .gift-code-box:active {
            transform: scale(0.95);
            background-color: #BF360C;
        }

        .gift-code-text {
            color: #FFFFFF;
            font-size: 20px;
            font-weight: bold;
            font-family: 'Jua', 'Comic Neue', monospace;
            letter-spacing: 2px;
            text-shadow: 1px 1px 0 #000;
        }

        .close-sunny {
            position: relative;
            z-index: 2;
            margin-top: 20px;
            background: #FF5252;
            color: white;
            border: 3px solid #000;
            padding: 10px 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Jua', 'Comic Neue', sans-serif;
            transition: transform 0.1s ease;
            border-radius: 0px;
            letter-spacing: 1px;
            text-shadow: 1px 1px 0 #000;
        }

        .close-sunny:active {
            transform: scale(0.95);
        }

        .gift-wrapper {
            margin-top: 20%;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            position: relative;
        }

        .gift-button {
            width: 350px;
            height: 150px;
            background-color: #FF9000;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: row;
            gap: 12px;
            cursor: default;
            font-family: 'Comic Neue', 'Jua', sans-serif;
            outline: 2px solid rgba(0,0,0,0.4);
            padding: 0 16px;
            box-sizing: border-box;
            position: relative;
            overflow: visible;
        }

        .gift-icon-small {
            position: absolute;
            bottom: 0px;
            left: 0%;
            width: auto;
            height: 250px;
            display: block;
            object-fit: contain;
            object-position: bottom;
            filter: drop-shadow(1px 1px 0 #6B3E00);
            z-index: 5;
            pointer-events: none;
        }

        .gift-divider {
            width: 50px;
            height: 50px;
            flex-shrink: 0;
            margin-left: 55px;
        }        

        .gift-text {
            font-size: 1rem;
            font-weight: bold;
            color: #FFFFFF;
            font-family: 'Comic Neue', 'Jua', sans-serif;
            -webkit-text-stroke: 1px #000000;
            text-stroke: 1px #000000;
            paint-order: stroke fill;
            letter-spacing: 0.3px;
            white-space: normal;
            text-align: center;
            line-height: 1.3;
            max-width: 160px;
            min-width: 120px;
        }

        .gift-footer-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 6px;
        }

        .small-icon-img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid #FFFFFF;
            background-color: #fff;
        }

        .copy-number-box {
            background-color: #E65100;
            padding: 14px 22px;
            border-radius: 4px;
            cursor: pointer;
            transition: transform 0.1s ease, background-color 0.1s ease;
            border: 1px solid #FFFFFF;
        }

        .copy-number-box:active {
            transform: scale(0.95);
            background-color: #BF360C;
        }

        .copy-number-text {
            color: #FFFFFF;
            font-size: 18px;
            font-weight: bold;
            font-family: 'Comic Neue', monospace;
            letter-spacing: 1px;
        }

        .gift-text-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .gift-click-img {
            width: 60px;
            height: 60px;
            object-fit: contain;
            cursor: pointer;
            transition: transform 0.1s ease;
            border-radius: 8px;
            margin-top: 10px;
            display: none;
        }

        .gift-click-img:active {
            transform: scale(0.95);
        }

        .gift-content-container {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .typing-cursor {
            display: inline-block;
            width: 2px;
            height: 1.1em;
            background-color: #fff;
            margin-left: 2px;
            vertical-align: middle;
            animation: blink 0.8s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .old-status {
            display: none;
        }
    </style>
</head>
<body>

    <img class="back-button" src="https://i.ibb.co/4T0YQ8X/x.png" alt="back" onerror="this.src='https://i.ibb.co/4T0YQ8X/x.png'">

    <div class="game-header">
        <img src="https://i.ibb.co/8LXXL88k/1780578850063.png" alt="P" onerror="this.src='https://i.ibb.co/8LXXL88k/1780578850063.png'">
        <h3>Alanna Pow Puzzle</h3>
    </div>

    <div id="board"></div>

    <div class="gift-wrapper">
        <div class="gift-button" id="giftButton">
            <img class="gift-icon-small" src="https://i.ibb.co/CK0Prqbq/kaden-kole.png" alt="kaden" onerror="this.src='https://i.ibb.co/CK0Prqbq/kaden-kole.png'">
            <div class="gift-divider"></div>
            <div class="gift-text-wrapper">
                <div class="gift-text" id="gameStatusText">Move pieces to solve the puzzle</div>
                
                <img id="giftClickImg" class="gift-click-img" src="https://i.ibb.co/tw563nkL/gift.gif" alt="Click Gift">
                
                <div id="giftContentContainer" class="gift-content-container">
                    <div class="gift-footer-row" id="row2">
                        <img class="small-icon-img" src="https://i.ibb.co/5gR875vF/1.jpg" alt="icon2" onerror="this.src='https://i.ibb.co/5gR875vF/1.jpg'">
                        <div class="copy-number-box" id="copyNumberBtn2">
                            <span class="copy-number-text">Suck9Balls</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="sunnyPopup" class="sunny-popup">
        <div class="sunny-bg"></div>
        <div class="sunny-text">Mission Complete!</div>
        <div class="sunny-box">
            <img id="rewardIconImg" src="https://i.ibb.co/DDMvMs05/image.gif" alt="Reward Icon">
        </div>
        <div class="gift-section">
            <div class="gift-label">Reward Code</div>
            <div class="gift-code-box" onclick="copyGiftCode()">
                <span class="gift-code-text" id="giftCodeText">Suck9Balls</span>
            </div>
        </div>
        <button class="close-sunny" onclick="closeSunnyPopup()">CLOSE</button>
    </div>

    <script>
        const imageSrc = 'https://i.ibb.co/Qv036vbn/Gym-Jljha4-AAz-Q82.jpg';
        const GRID_SIZE = 4;
        const TOTAL_PIECES = 16;
        const PIECE_SIZE_PX = 100;
        const FULL_IMG_SIZE = 400;

        const boardEl = document.getElementById('board');
        const sunnyPopup = document.getElementById('sunnyPopup');
        const giftButton = document.getElementById('giftButton');
        const gameStatusText = document.getElementById('gameStatusText');
        const giftClickImg = document.getElementById('giftClickImg');
        const giftContentContainer = document.getElementById('giftContentContainer');

        let draggedElement = null;
        let sourceContainer = null;
        let touchOffsetX = 0, touchOffsetY = 0;
        let gameCompleted = false;
        let giftRevealed = false;
        
        let typingTimeout = null;
        let currentText = "";
        let lastTriggeredMilestone = -1;
        
        const milestoneMessages = {
            start: "Move the pieces to their correct positions",
            firstPiece: "Great, keep up the work",
            halfComplete: "Great, you've completed half the puzzle!",
            threeQuarters: "Two icons are waiting for you to win them...",
            win: "You won"
        };
        
        function saveGameState(piecesOrder) {
            const state = {
                piecesOrder: piecesOrder,
                gameCompleted: gameCompleted,
                giftRevealed: giftRevealed,
                lastTriggeredMilestone: lastTriggeredMilestone
            };
            localStorage.setItem('alannaPuzzleState', JSON.stringify(state));
        }
        
        function loadGameState() {
            const saved = localStorage.getItem('alannaPuzzleState');
            if (saved) {
                try {
                    return JSON.parse(saved);
                } catch(e) { return null; }
            }
            return null;
        }
        
        function clearGameState() {
            localStorage.removeItem('alannaPuzzleState');
        }
        
        function typeWriter(text, element, callback) {
            if (typingTimeout) clearTimeout(typingTimeout);
            element.innerHTML = "";
            currentText = text;
            let i = 0;
            function typeNext() {
                if (i < currentText.length) {
                    element.innerHTML = currentText.substring(0, i + 1);
                    i++;
                    typingTimeout = setTimeout(typeNext, 35);
                } else {
                    if (callback) callback();
                    typingTimeout = null;
                }
            }
            typeNext();
        }
        
        function updateMessageWithTyping(message, force = false) {
            if (!gameStatusText) return;
            if (!force && gameStatusText.innerText === message) return;
            typeWriter(message, gameStatusText);
        }
        
        function updateProgressAndMessages(placedCount, isFirstCorrectPlacement = false) {
            if (gameCompleted) return;
            const percentage = (placedCount / TOTAL_PIECES) * 100;
            let milestone = -1;
            
            if (percentage >= 100) {
                milestone = 4;
            } else if (percentage >= 75 && lastTriggeredMilestone < 3) {
                milestone = 3;
            } else if (percentage >= 50 && lastTriggeredMilestone < 2) {
                milestone = 2;
            } else if (isFirstCorrectPlacement && placedCount === 1 && lastTriggeredMilestone < 1) {
                milestone = 1;
            }
            
            if (milestone !== -1 && milestone > lastTriggeredMilestone) {
                lastTriggeredMilestone = milestone;
                let message = "";
                switch(milestone) {
                    case 1: message = milestoneMessages.firstPiece; break;
                    case 2: message = milestoneMessages.halfComplete; break;
                    case 3: message = milestoneMessages.threeQuarters; break;
                    case 4: message = milestoneMessages.win; break;
                }
                if (message) updateMessageWithTyping(message, true);
            }
        }
        
        function resetGameMessages() {
            lastTriggeredMilestone = 0;
            updateMessageWithTyping(milestoneMessages.start, true);
        }

        window.closeSunnyPopup = function() {
            sunnyPopup.style.display = 'none';
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast-message';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('fade-out');
                setTimeout(() => toast.remove(), 200);
            }, 2000);
        }

        window.copyGiftCode = function() {
            const code = document.getElementById('giftCodeText').innerText;
            navigator.clipboard.writeText(code).then(() => {
                showToast('Code Copied!');
            }).catch(() => {
                alert('Press Ctrl+C to copy: ' + code);
            });
        }

        function copyNumber(number, toastMessage) {
            navigator.clipboard.writeText(number).then(() => {
                showToast(toastMessage || number + ' Copied!');
            }).catch(() => {
                alert('Press Ctrl+C to copy: ' + number);
            });
        }

        function openSunnyPopup() {
            sunnyPopup.style.display = 'flex';
        }

        function showGiftImage() {
            if (giftClickImg) {
                giftClickImg.style.display = 'block';
            }
        }

        function onGiftClick() {
            if (!gameCompleted) {
                showToast('Complete the puzzle first!');
                return;
            }
            
            if (!giftRevealed) {
                giftClickImg.style.display = 'none';
                giftContentContainer.style.display = 'flex';
                giftRevealed = true;
                openSunnyPopup();
                saveGameState(getCurrentPiecesOrder());
            }
        }

        function resetGiftButtonState() {
            giftRevealed = false;
            giftClickImg.style.display = 'none';
            giftContentContainer.style.display = 'none';
        }

        function removeBoardGaps() {
            boardEl.classList.add('no-gaps');
        }

        function getCurrentPiecesOrder() {
            const slots = document.querySelectorAll('.slot');
            const order = [];
            for (let slot of slots) {
                const piece = slot.querySelector('.piece-container');
                if (piece) {
                    order.push(parseInt(piece.dataset.pieceId));
                } else {
                    order.push(-1);
                }
            }
            return order;
        }

        function restorePiecesOrder(order) {
            const slots = document.querySelectorAll('.slot');
            for (let i = 0; i < slots.length; i++) {
                const pieceId = order[i];
                if (pieceId !== -1) {
                    const piece = document.querySelector(`.piece-container[data-piece-id="${pieceId}"]`);
                    if (piece && piece.parentElement !== slots[i]) {
                        slots[i].appendChild(piece);
                    }
                }
            }
            updateAllPieceBackgrounds();
        }

        function showWinReward() {
            if (gameCompleted) return;
            gameCompleted = true;
            removeBoardGaps();
            showGiftImage();
            updateMessageWithTyping(milestoneMessages.win, true);
            saveGameState(getCurrentPiecesOrder());
        }

        function createAdaptivePieceElement(pieceId) {
            const container = document.createElement('div');
            container.className = 'piece-container';
            container.dataset.pieceId = pieceId;
            container.draggable = true;
            const slice = document.createElement('div');
            slice.className = 'piece-image-slice';
            slice.style.backgroundImage = `url('${imageSrc}')`;
            slice.style.backgroundRepeat = 'no-repeat';
            container.appendChild(slice);
            
            container.addEventListener('dragstart', dragStartMouse);
            container.addEventListener('dragend', dragEndMouse);
            container.addEventListener('touchstart', touchStart, { passive: false });
            container.addEventListener('touchmove', touchMove, { passive: false });
            container.addEventListener('touchend', touchEnd, { passive: false });
            return container;
        }

        function dragStartMouse(e) {
            if (gameCompleted) { e.preventDefault(); return false; }
            draggedElement = this;
            sourceContainer = this.parentElement;
            setTimeout(() => this.style.opacity = '0.4', 0);
            e.dataTransfer.setData('text/plain', '');
            e.dataTransfer.effectAllowed = 'move';
        }

        function dragEndMouse() {
            if (this.style) this.style.opacity = '';
            draggedElement = null;
            sourceContainer = null;
            document.querySelectorAll('.slot').forEach(slot => slot.classList.remove('drag-over'));
        }

        function dragOverSlot(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; }
        function dragEnterSlot(e) { e.preventDefault(); this.classList.add('drag-over'); }
        function dragLeaveSlot() { this.classList.remove('drag-over'); }

        function dropMouse(e) {
            e.preventDefault();
            this.classList.remove('drag-over');
            if (draggedElement && !gameCompleted && draggedElement.parentElement !== this) {
                handlePiecePlacement(draggedElement, this, sourceContainer);
            }
        }

        function touchStart(e) {
            if (gameCompleted) return;
            e.preventDefault();
            draggedElement = this;
            sourceContainer = this.parentElement;
            const touch = e.touches[0];
            const rect = this.getBoundingClientRect();
            touchOffsetX = touch.clientX - rect.left;
            touchOffsetY = touch.clientY - rect.top;
            
            this.style.width = rect.width + 'px';
            this.style.height = rect.height + 'px';
            this.style.position = 'fixed';
            this.style.left = (touch.clientX - touchOffsetX) + 'px';
            this.style.top = (touch.clientY - touchOffsetY) + 'px';
            this.style.zIndex = '9999';
            this.style.opacity = '0.8';
        }

        function touchMove(e) {
            if (!draggedElement || gameCompleted) return;
            e.preventDefault();
            const touch = e.touches[0];
            draggedElement.style.left = (touch.clientX - touchOffsetX) + 'px';
            draggedElement.style.top = (touch.clientY - touchOffsetY) + 'px';
            
            const elemUnderTouch = document.elementsFromPoint(touch.clientX, touch.clientY);
            const slotUnder = elemUnderTouch.find(el => el.classList && el.classList.contains('slot'));
            document.querySelectorAll('.slot').forEach(slot => slot.classList.remove('drag-over'));
            if (slotUnder) slotUnder.classList.add('drag-over');
        }

        function touchEnd(e) {
            if (!draggedElement || gameCompleted) {
                if(draggedElement) cleanupTouchDrag();
                return;
            }
            e.preventDefault();
            const touch = e.changedTouches[0];
            const elemUnderTouch = document.elementsFromPoint(touch.clientX, touch.clientY);
            const targetSlot = elemUnderTouch.find(el => el.classList && el.classList.contains('slot'));
            
            cleanupTouchDrag();
            
            if (targetSlot && draggedElement.parentElement !== targetSlot) {
                handlePiecePlacement(draggedElement, targetSlot, sourceContainer);
            } else if (targetSlot && draggedElement.parentElement === targetSlot) {
            } else {
                if (sourceContainer && sourceContainer.appendChild) {
                    sourceContainer.appendChild(draggedElement);
                }
            }
            
            draggedElement = null;
            sourceContainer = null;
            document.querySelectorAll('.slot').forEach(slot => slot.classList.remove('drag-over'));
        }
        
        function cleanupTouchDrag() {
            if (draggedElement) {
                draggedElement.style.position = '';
                draggedElement.style.left = '';
                draggedElement.style.top = '';
                draggedElement.style.width = '';
                draggedElement.style.height = '';
                draggedElement.style.zIndex = '';
                draggedElement.style.opacity = '';
            }
        }

        function countCorrectPieces() {
            const slots = document.querySelectorAll('.slot');
            let correctCount = 0;
            for (let slot of slots) {
                const piece = slot.querySelector('.piece-container');
                if (piece) {
                    const pieceId = parseInt(piece.dataset.pieceId);
                    const correctId = parseInt(slot.dataset.correctId);
                    if (pieceId === correctId) correctCount++;
                }
            }
            return correctCount;
        }

        function shufflePiecesWithNoCorrectPositions(piecesList, slotsCount, maxAttempts = 50) {
            let attempts = 0;
            let shuffled = [...piecesList];
            
            while (attempts < maxAttempts) {
                for (let i = shuffled.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                }
                let hasCorrectPosition = false;
                for (let i = 0; i < slotsCount; i++) {
                    const pieceId = parseInt(shuffled[i].dataset.pieceId);
                    if (pieceId === i) {
                        hasCorrectPosition = true;
                        break;
                    }
                }
                if (!hasCorrectPosition) {
                    return shuffled;
                }
                attempts++;
            }
            for (let i = 0; i < slotsCount; i++) {
                const pieceId = parseInt(shuffled[i].dataset.pieceId);
                if (pieceId === i) {
                    let swapIndex = (i + 1) % slotsCount;
                    if (swapIndex === i) swapIndex = (i + 2) % slotsCount;
                    [shuffled[i], shuffled[swapIndex]] = [shuffled[swapIndex], shuffled[i]];
                }
            }
            return shuffled;
        }

        function handlePiecePlacement(movingPiece, targetSlot, originContainer) {
            if (gameCompleted) return;
            
            let correctBefore = countCorrectPieces();
            
            const existingPiece = targetSlot.querySelector('.piece-container');
            
            if (!existingPiece) {
                targetSlot.appendChild(movingPiece);
            } else if (existingPiece !== movingPiece) {
                targetSlot.appendChild(movingPiece);
                if (originContainer && originContainer.classList && originContainer.classList.contains('slot')) {
                    originContainer.appendChild(existingPiece);
                } else if (originContainer && originContainer.appendChild) {
                    originContainer.appendChild(existingPiece);
                } else {
                    const firstEmpty = Array.from(document.querySelectorAll('.slot')).find(slot => !slot.querySelector('.piece-container'));
                    if (firstEmpty) firstEmpty.appendChild(existingPiece);
                }
            }
            
            setTimeout(() => {
                updateAllPieceBackgrounds();
                let correctAfter = countCorrectPieces();
                let isFirstCorrect = (correctBefore === 0 && correctAfter === 1);
                updateProgressAndMessages(correctAfter, isFirstCorrect);
                saveGameState(getCurrentPiecesOrder());
                checkWin();
            }, 15);
        }

        function updateAllPieceBackgrounds() {
            const pieces = document.querySelectorAll('.piece-container');
            if (pieces.length === 0) return;
            const firstSlot = document.querySelector('.slot');
            if (!firstSlot) return;
            const currentSlotSize = firstSlot.clientWidth;
            if (currentSlotSize === 0) return;
            const scale = currentSlotSize / PIECE_SIZE_PX;
            const newFullSize = FULL_IMG_SIZE * scale;
            
            pieces.forEach(piece => {
                const pieceId = parseInt(piece.dataset.pieceId);
                if (isNaN(pieceId)) return;
                const row = Math.floor(pieceId / GRID_SIZE);
                const col = pieceId % GRID_SIZE;
                const sliceDiv = piece.querySelector('.piece-image-slice');
                if (sliceDiv) {
                    sliceDiv.style.backgroundSize = `${newFullSize}px ${newFullSize}px`;
                    const offsetX = col * currentSlotSize;
                    const offsetY = row * currentSlotSize;
                    sliceDiv.style.backgroundPosition = `-${offsetX}px -${offsetY}px`;
                }
            });
        }

        function checkWin() {
            if (gameCompleted) return;
            const slots = document.querySelectorAll('.slot');
            let allMatched = true;
            let filledCount = 0;
            
            for (let slot of slots) {
                const piece = slot.querySelector('.piece-container');
                if (!piece) {
                    allMatched = false;
                    break;
                }
                filledCount++;
                const pieceId = parseInt(piece.dataset.pieceId);
                const correctId = parseInt(slot.dataset.correctId);
                if (pieceId !== correctId) allMatched = false;
            }
            if (filledCount === TOTAL_PIECES && allMatched && !gameCompleted) {
                showWinReward();
            }
        }

        let resizeObserver = null;
        function attachResizeObserver() {
            if (resizeObserver) resizeObserver.disconnect();
            const boardContainer = document.getElementById('board');
            if (!boardContainer) return;
            resizeObserver = new ResizeObserver(() => updateAllPieceBackgrounds());
            resizeObserver.observe(boardContainer);
        }

        function initGame(restoreFromSave = true) {
            gameCompleted = false;
            sunnyPopup.style.display = 'none';
            draggedElement = null;
            sourceContainer = null;
            
            boardEl.classList.remove('no-gaps');
            boardEl.innerHTML = '';
            
            for (let i = 0; i < TOTAL_PIECES; i++) {
                const slot = document.createElement('div');
                slot.className = 'slot';
                slot.dataset.correctId = i;
                slot.addEventListener('dragover', dragOverSlot);
                slot.addEventListener('dragenter', dragEnterSlot);
                slot.addEventListener('dragleave', dragLeaveSlot);
                slot.addEventListener('drop', dropMouse);
                boardEl.appendChild(slot);
            }
            
            const piecesList = [];
            for (let id = 0; id < TOTAL_PIECES; id++) {
                piecesList.push(createAdaptivePieceElement(id));
            }
            
            const savedState = restoreFromSave ? loadGameState() : null;
            
            if (savedState && savedState.piecesOrder) {
                const slots = document.querySelectorAll('.slot');
                for (let i = 0; i < slots.length; i++) {
                    const pieceId = savedState.piecesOrder[i];
                    if (pieceId !== -1) {
                        const piece = piecesList.find(p => parseInt(p.dataset.pieceId) === pieceId);
                        if (piece) {
                            slots[i].appendChild(piece);
                        }
                    }
                }
                gameCompleted = savedState.gameCompleted || false;
                giftRevealed = savedState.giftRevealed || false;
                lastTriggeredMilestone = savedState.lastTriggeredMilestone || 0;
                
                if (gameCompleted) {
                    removeBoardGaps();
                    showGiftImage();
                    if (giftRevealed) {
                        giftClickImg.style.display = 'none';
                        giftContentContainer.style.display = 'flex';
                    }
                    updateMessageWithTyping(milestoneMessages.win, true);
                } else {
                    resetGameMessages();
                    resetGiftButtonState();
                }
            } else {
                const shuffledPieces = shufflePiecesWithNoCorrectPositions(piecesList, TOTAL_PIECES, 30);
                const slots = document.querySelectorAll('.slot');
                for (let i = 0; i < slots.length; i++) {
                    slots[i].appendChild(shuffledPieces[i]);
                }
                resetGameMessages();
                resetGiftButtonState();
            }
            
            setTimeout(() => {
                updateAllPieceBackgrounds();
                attachResizeObserver();
                if (!savedState || !savedState.piecesOrder) {
                    let initialCorrect = countCorrectPieces();
                    if (initialCorrect > 0) {
                        const allPieces = Array.from(document.querySelectorAll('.piece-container'));
                        for (let i = allPieces.length - 1; i > 0; i--) {
                            const j = Math.floor(Math.random() * (i + 1));
                            if (i !== j) {
                                const parentI = allPieces[i].parentElement;
                                const parentJ = allPieces[j].parentElement;
                                if (parentI && parentJ) {
                                    parentI.appendChild(allPieces[j]);
                                    parentJ.appendChild(allPieces[i]);
                                }
                            }
                        }
                        updateAllPieceBackgrounds();
                    }
                }
                checkWin();
            }, 30);
        }
        
        initGame(true);

        const copyNumberBtn2 = document.getElementById('copyNumberBtn2');
        if (copyNumberBtn2) {
            copyNumberBtn2.addEventListener('click', () => copyNumber('Suck9Balls', 'Code Copied!'));
        }

        if (giftClickImg) {
            giftClickImg.addEventListener('click', onGiftClick);
        }
        
        const backBtn = document.querySelector('.back-button');
        if (backBtn) {
            backBtn.addEventListener('click', function() {
                window.history.back();
            });
        }
        
    </script>
</body>
</html>
