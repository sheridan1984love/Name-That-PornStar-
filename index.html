            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;

        /* حاوية اختيار الشخصية ملاصقة تماماً للجزء العلوي من صندوق الحوار */
        .character-select-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: absolute;
            bottom: calc(5vh + 145px); 
            z-index: 5;
            transition: all 0.3s ease;
            width: 350px; 
            height: 280px;
        }

        /* عناصر التحكم بالتقليب تعتمد على التموضع المطلق لمنع تأثرها بالعرض */
        .selector-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            position: relative;
        }

        .char-arrow-btn {
            background: #E65100;
            border: 2px solid #FFFFFF;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            font-size: 18px;
            cursor: pointer;
            color: #FFFFFF;
            box-shadow: 1px 2px 4px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s ease;
            position: absolute;

            object-fit: contain;
            filter: drop-shadow(2px 2px 0 rgba(0,0,0,0.3));
            transition: transform 0.3s ease;
            display: block;
        }

        /* حاوية الحوار السفلي مع دعم تأثير الفايد الناعم */

            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            width: 100%;
            height: auto;
            z-index: 10;
            opacity: 1;
            transition: opacity 0.5s ease;
        }

            height: 150px;

            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: row;

            outline: 2px solid rgba(0,0,0,0.4);
            padding: 0 16px;
            position: relative;
            overflow: visible;
            margin-bottom: 5vh;
            cursor: pointer;
        }

        .character-icon {
            position: absolute;
            bottom: 0px;
            left: -5%;

            height: 250px;
            display: block;
            object-fit: contain;

        .divider-space.hidden-space {

            { name: "Lily Lou", img: "https://i.ibb.co/sdwT0Wvp/lily-lou-9b4317336ec93fc2ae4b1a79680289d0.png", video: "https://www.dropbox.com/scl/fi/tro0qzlo79x0vshgec2k5/Background-video.mp4?rlkey=09ylr3zzzeedbmm19vbt73evd&st=r1bhj4zf&dl=1" }
        ];

        const gameOptionsList = ["Lena Paul", "Angela White", "Sheridan love", "Lily Lou"];

        // ========================
        // 2. إدارة الحالة والاستجابة
        // ========================
        let currentLanguageIndex = 0;
        let currentLanguageCode = 'en';
        let currentCharacterIndex = 0;

        let step = 0; 
        let waitingForNext = false;
        let answerLocked = false;
        let languageConfirmed = false;
        let typewriterTimeout = null;
        let rewardTimeout = null;
        let isPlayerCorrect = false; 

        const mainDialogBox = document.getElementById('mainDialogBox');
        const textContentDiv = document.getElementById('textContent');
        const prevLangBtn = document.getElementById('prevLangBtn');
        const nextLangBtn = document.getElementById('nextLangBtn');
        const confirmLangBtn = document.getElementById('confirmLangBtn');
        const setupControlsContainer = document.getElementById('setupControlsContainer');
        const optionsCornerDiv = document.getElementById('optionsCorner');
        const dialogDividerSpace = document.getElementById('dialogDividerSpace');
        const gameDialogWrapper = document.getElementById('gameDialogWrapper');

        const characterSelectContainer = document.getElementById('characterSelectContainer');
        const centerCharacterView = document.getElementById('centerCharacterView');
        const prevCharBtn = document.getElementById('prevCharBtn');
        const nextCharBtn = document.getElementById('nextCharBtn');

        // عناصر مشغل الفيديو المدمج
        const videoContainer = document.getElementById('video-container');
        const rewardVideo = document.getElementById('reward-video');
        const progressBar = document.getElementById('progress-bar');
        const loadingOverlay = document.getElementById('loading-overlay');

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast-message';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('fade-out');
                setTimeout(() => toast.remove(), 200);
            }, 1500);
        }

        function typeWriter(text, element, callback) {
            if (typewriterTimeout) clearTimeout(typewriterTimeout);
            element.innerHTML = "";
            let i = 0;
            function typeNext() {
                if (i < text.length) {
                    element.innerHTML += text[i];
                    i++;
                    typewriterTimeout = setTimeout(typeNext, 30);
                } else {
                    if (callback) callback();
                }
            }
            typeNext();
        }

        function updateLanguageSelector() {
            const lang = availableLanguages[currentLanguageIndex];
            currentLanguageCode = lang.code;
            document.getElementById('currentLangDisplay').textContent = lang.name;
            
            if (!languageConfirmed) {
                renderLanguageChoiceScreen();
            }
        }

        function updateCharacterSelector() {
            centerCharacterView.src = gameCharacters[currentCharacterIndex].img;
        }

        function renderLanguageChoiceScreen() {
            textContentDiv.innerHTML = '';
            const oldHint = mainDialogBox.querySelector('.click-hint');
            if (oldHint) oldHint.remove();

            const msgDiv = document.createElement('div');
            msgDiv.className = 'dialog-message setup-padding';
            textContentDiv.appendChild(msgDiv);
            
            typeWriter(translations[currentLanguageCode].chooseLang, msgDiv, null);
        }

        mainDialogBox.addEventListener('click', (e) => {
            if (!languageConfirmed) return;
            if (e.target.classList.contains('restart-button')) return;
            
            // قفل النقر في الخطوة 3 فقط في حالة الإجابة الصحيحة (لأنها ستنتقل تلقائياً)
            if (step === 3 && isPlayerCorrect) return; 
            if (step === 2) return; 

            if (step < 14) {
                step++;
                renderStep();
            }
        });

        function handleAnswer(selectedName) {
            if (answerLocked) return;
            const correct = gameCharacters[currentCharacterIndex].name;
            isPlayerCorrect = (selectedName === correct);
            answerLocked = true;
            step = 3; 
            optionsCornerDiv.classList.add('hidden');
            optionsCornerDiv.innerHTML = '';
            renderStep();
        }

        function showOptionsInCorner() {
            optionsCornerDiv.innerHTML = '';
            const grid = document.createElement('div');
            grid.className = 'options-grid';
            gameOptionsList.forEach(opt => {
                const btn = document.createElement('div');
                btn.className = 'option-btn';
                btn.textContent = opt;
                btn.onclick = (e) => {
                    e.stopPropagation(); 
                    handleAnswer(opt);
                };
                grid.appendChild(btn);
            });
            optionsCornerDiv.appendChild(grid);
            optionsCornerDiv.classList.remove('hidden');
            adjustOptionsCornerPosition();
        }

        // ========================
        // 3. نظام تشغيل فيديوهات المكافآت مع تأثيرات Fade
        // ========================
        let isVideoPlaying = false;
        let videoStallTimeout = null;

        function toggleVideoOverlay(show) {
            if (show) {
                loadingOverlay.style.visibility = 'visible';
                loadingOverlay.style.opacity = '1';
            } else {
                loadingOverlay.style.opacity = '0';
                setTimeout(() => {
                    loadingOverlay.style.visibility = 'hidden';
                }, 300);
            }
        }

        function syncVideoProgressBar() {
            if (!rewardVideo || !progressBar) return;
            if (rewardVideo.duration && isFinite(rewardVideo.duration) && rewardVideo.currentTime) {
                const percent = (rewardVideo.currentTime / rewardVideo.duration) * 100;
                progressBar.style.width = percent + "%";
            }
            if (!rewardVideo.ended && !videoContainer.classList.contains('hidden')) {
                requestAnimationFrame(syncVideoProgressBar);
            } else if (rewardVideo.ended) {
                progressBar.style.width = "100%";
            }
        }

        function startRewardVideoSequence() {
            gameDialogWrapper.classList.add('fade-out-element');
            
            setTimeout(() => {
                gameDialogWrapper.classList.add('hidden');
                
                rewardVideo.src = gameCharacters[currentCharacterIndex].video;
                videoContainer.classList.remove('hidden');
                
                videoContainer.offsetHeight; 
                videoContainer.classList.add('fade-in-element');
                progressBar.style.width = "0%";
                
                rewardVideo.onplaying = () => {
                    isVideoPlaying = true;
                    toggleVideoOverlay(false);
                    if (videoStallTimeout) clearTimeout(videoStallTimeout);
                };

                rewardVideo.onwaiting = () => {
                    isVideoPlaying = false;
                    toggleVideoOverlay(true);
                };

                rewardVideo.onstalled = () => {
                    if (!isVideoPlaying) toggleVideoOverlay(true);
                };

                rewardVideo.oncanplay = () => {
                    if (!isVideoPlaying && rewardVideo.paused === false) {
                        toggleVideoOverlay(false);
                    }
                };

                rewardVideo.onended = () => {
                    toggleVideoOverlay(false);
                    closeVideoWithFadeEffect();
                };

                rewardVideo.onerror = () => {
                    toggleVideoOverlay(false);
                    closeVideoWithFadeEffect();
                };

                rewardVideo.load();
                const playPromise = rewardVideo.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        requestAnimationFrame(syncVideoProgressBar);
                        toggleVideoOverlay(false);
                    }).catch(() => {
                        const bypassAutoplay = () => {
                            rewardVideo.play().then(() => {
                                requestAnimationFrame(syncVideoProgressBar);
                                toggleVideoOverlay(false);
                            }).catch(() => {});
                            document.body.removeEventListener('click', bypassAutoplay);
                            document.body.removeEventListener('touchstart', bypassAutoplay);
                        };
                        document.body.addEventListener('click', bypassAutoplay);
                        document.body.addEventListener('touchstart', bypassAutoplay);
                        toggleVideoOverlay(true);
                    });
                }
            }, 500);
        }

        function closeVideoWithFadeEffect() {
            videoContainer.classList.remove('fade-in-element');
            
            setTimeout(() => {
                rewardVideo.pause();
                videoContainer.classList.add('hidden');
                
                gameDialogWrapper.classList.remove('hidden');
                gameDialogWrapper.offsetHeight; 
                gameDialogWrapper.classList.remove('fade-out-element');
                
                step = 4;
                renderStep();
            }, 500);
        }

        // ========================
        // 4. محرك الخطوات والحوارات التعليمية
        // ========================
        function renderStep() {
            if (!languageConfirmed) {
                renderLanguageChoiceScreen();
                return;
            }

            textContentDiv.innerHTML = '';
            const t = translations[currentLanguageCode];

            const oldHint = mainDialogBox.querySelector('.click-hint');
            if (oldHint) oldHint.remove();

            if (step !== 2) {
                optionsCornerDiv.classList.add('hidden');
                optionsCornerDiv.innerHTML = '';
            }

            if (rewardTimeout) clearTimeout(rewardTimeout);

            // الخطوة 0: الترحيب
            if (step === 0) {
                const msgDiv = document.createElement('div');
                msgDiv.className = 'dialog-message';
                textContentDiv.appendChild(msgDiv);

                typeWriter(t.welcome, msgDiv, () => {
                    waitingForNext = true;
                    addClickHint(t.clickHint);
                });
            } 
            // الخطوة 1: شرح فكرة التخمين
            else if (step === 1) {
                const msgDiv = document.createElement('div');
                msgDiv.className = 'dialog-message';
                textContentDiv.appendChild(msgDiv);

                typeWriter(t.guessGame, msgDiv, () => {
                    waitingForNext = true;
                    addClickHint(t.clickHint);
                });
            }
            // الخطوة 2: سؤال الهوية وظهور الأزرار الأربعة
            else if (step === 2) {
                const questionDiv = document.createElement('div');
                questionDiv.className = 'dialog-message';
                textContentDiv.appendChild(questionDiv);
                
                typeWriter(t.askIdentity, questionDiv, () => {
                    showOptionsInCorner();
                });
            }
            // الخطوة 3: النتيجة (تفعيل المكافأة والفايد فقط إذا كانت الإجابة صحيحة)
            else if (step === 3) {
                const resultDiv = document.createElement('div');
                resultDiv.className = 'dialog-message';
                textContentDiv.appendChild(resultDiv);
                
                const finalResponseText = isPlayerCorrect ? t.resultCorrect : t.resultWrong;
                typeWriter(finalResponseText, resultDiv, () => {
                    if (isPlayerCorrect) {
                        // إجابة صحيحة: تفعيل مشغل الفيديو والانتقال التلقائي بالفايد بعد ثانيتين
                        rewardTimeout = setTimeout(() => {
                            startRewardVideoSequence();
                        }, 2000);
                    } else {
                        // إجابة خاطئة: انتظار نقرة عادية من اللاعب للمتابعة للخطوة القادمة
                        waitingForNext = true;
                        addClickHint(t.clickHint);
                    }
                });
            }
            // الخطوة 4: التعليمات العامة
            else if (step === 4) {
                const msgDiv = document.createElement('div');
                msgDiv.className = 'dialog-message';
                textContentDiv.appendChild(msgDiv);

                typeWriter(t.learnGame, msgDiv, () => {
                    waitingForNext = true;
                    addClickHint(t.clickHint);
                });
            }
            // الخطوة 5: صفحة تسجيل الدخول
            else if (step === 5) {
                const msgDiv = document.createElement('div');
                msgDiv.className = 'dialog-message';
                textContentDiv.appendChild(msgDiv);

                typeWriter(t.startLogin, msgDiv, () => {
                    waitingForNext = true;
                    addClickHint(t.clickHint);
                });
            }
            // الخطوة 6: قواعد الإدخال
            else if (step === 6) {
                const msgDiv = document.createElement('div');
                msgDiv.className = 'dialog-message';
                textContentDiv.appendChild(msgDiv);

                typeWriter(t.inputRules, msgDiv, () => {
                    waitingForNext = true;
                    addClickHint(t.clickHint);
                });
            }
            // الخطوة 7: قيود الأحرف
            else if (step === 7) {
                const msgDiv = document.createElement('div');
                msgDiv.className = 'dialog-message';
                textContentDiv.appendChild(msgDiv);

                typeWriter(t.limitWarning, msgDiv, () => {
                    waitingForNext = true;
                    addClickHint(t.clickHint);
                });
            }
            // الخطوة 8: القائمة الرئيسية
            else if (step === 8) {
                const msgDiv = document.createElement('div');
                msgDiv.className = 'dialog-message';
                textContentDiv.appendChild(msgDiv);

                typeWriter(t.goToMainMenu, msgDiv, () => {
                    waitingForNext = true;
                    addClickHint(t.clickHint);
                });
            }
            // الخطوة 9: محتويات القائمة
            else if (step === 9) {
                const msgDiv = document.createElement('div');
                msgDiv.className = 'dialog-message';
                textContentDiv.appendChild(msgDiv);

                typeWriter(t.menuContent, msgDiv, () => {
                    waitingForNext = true;
                    addClickHint(t.clickHint);
                });
            }
            // الخطوة 10: زر الملف الشخصي
            else if (step === 10) {
                const msgDiv = document.createElement('div');
                msgDiv.className = 'dialog-message';
                textContentDiv.appendChild(msgDiv);

                typeWriter(t.profileBtn, msgDiv, () => {
                    waitingForNext = true;
                    addClickHint(t.clickHint);
                });
            }
            // الخطوة 11: تفاصيل الملف الشخصي
            else if (step === 11) {
                const msgDiv = document.createElement('div');
                msgDiv.className = 'dialog-message';
                textContentDiv.appendChild(msgDiv);

                typeWriter(t.profileDetails, msgDiv, () => {
                    waitingForNext = true;
                    addClickHint(t.clickHint);
                });
            }
            // الخطوة 12: تخصيص الملف الشخصي
            else if (step === 12) {
                const msgDiv = document.createElement('div');
                msgDiv.className = 'dialog-message';
                textContentDiv.appendChild(msgDiv);

                typeWriter(t.customizeProfile, msgDiv, () => {
                    waitingForNext = true;
                    addClickHint(t.clickHint);
                });
            }
            // الخطوة 13: متجر الأيقونات والهدايا
            else if (step === 13) {
                const msgDiv = document.createElement('div');
                msgDiv.className = 'dialog-message';
                textContentDiv.appendChild(msgDiv);

                typeWriter(t.iconSource, msgDiv, () => {
                    waitingForNext = true;
                    addClickHint(t.clickHint);
                });
            }
            // الخطوة 14: قائمة الصدارة وزر إعادة التشغيل
            else if (step === 14) {
                const msgDiv = document.createElement('div');
                msgDiv.className = 'dialog-message';
                textContentDiv.appendChild(msgDiv);

                typeWriter(t.leaderboardVisibility, msgDiv, () => {
                    const restartBtn = document.createElement('div');
                    restartBtn.className = 'restart-button';
                    restartBtn.textContent = 'Play Again';
                    restartBtn.onclick = (e) => {
                        e.stopPropagation();
                        resetToSetupMode();
                    };
                    textContentDiv.appendChild(restartBtn);
                });
            }
        }

        function addClickHint(text) {
            const hintSpan = document.createElement('span');
            hintSpan.className = 'click-hint';
            hintSpan.textContent = text;
            mainDialogBox.appendChild(hintSpan);
        }

        function resetToSetupMode() {
            step = 0;
            waitingForNext = false;
            answerLocked = false;
            languageConfirmed = false;
            isPlayerCorrect = false;
            
            if (rewardTimeout) clearTimeout(rewardTimeout);
            rewardVideo.pause();
            
            videoContainer.classList.remove('fade-in-element');
            videoContainer.classList.add('hidden');
            
            gameDialogWrapper.classList.remove('hidden');
            gameDialogWrapper.classList.remove('fade-out-element');
            
            const activeCharIcon = mainDialogBox.querySelector('.character-icon');
            if (activeCharIcon) activeCharIcon.remove();
            
            dialogDividerSpace.classList.add('hidden-space');
            setupControlsContainer.classList.remove('hidden');
            characterSelectContainer.classList.remove('hidden');
            
            updateLanguageSelector();
            updateCharacterSelector();
        }

        function adjustOptionsCornerPosition() {
            const dialogBox = document.querySelector('.dialog-box');
            if (dialogBox && optionsCornerDiv && !optionsCornerDiv.classList.contains('hidden')) {
                const rect = dialogBox.getBoundingClientRect();
                optionsCornerDiv.style.bottom = `${window.innerHeight - rect.top + 10}px`;
                optionsCornerDiv.style.right = `${window.innerWidth - rect.right}px`;
                optionsCornerDiv.style.transform = 'translateX(0)';
            }
        }

        window.addEventListener('resize', () => {
            if (step === 2) adjustOptionsCornerPosition();
        });

        // ========================
        // 5. مستمعي الأحداث والتحكم بالتقليب
        // ========================
        prevLangBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            let newIndex = currentLanguageIndex - 1;
            if (newIndex < 0) newIndex = availableLanguages.length - 1;
            currentLanguageIndex = newIndex;
            updateLanguageSelector();
        });

        nextLangBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            let newIndex = currentLanguageIndex + 1;
            if (newIndex >= availableLanguages.length) newIndex = 0;
            currentLanguageIndex = newIndex;
            updateLanguageSelector();
        });

        prevCharBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            let newIndex = currentCharacterIndex - 1;
            if (newIndex < 0) newIndex = gameCharacters.length - 1;
            currentCharacterIndex = newIndex;
            updateCharacterSelector();
        });

        nextCharBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            let newIndex = currentCharacterIndex + 1;
            if (newIndex >= gameCharacters.length) newIndex = 0;
            currentCharacterIndex = newIndex;
            updateCharacterSelector();
        });

        confirmLangBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            languageConfirmed = true;
            
            characterSelectContainer.classList.add('hidden');
            setupControlsContainer.classList.add('hidden'); 
            
            dialogDividerSpace.classList.remove('hidden-space');
            
            const characterImgElement = document.createElement('img');
            characterImgElement.className = 'character-icon';
            characterImgElement.src = gameCharacters[currentCharacterIndex].img;
            characterImgElement.alt = "character";
            mainDialogBox.insertBefore(characterImgElement, dialogDividerSpace);
            
            showToast(translations[currentLanguageCode].toastLang);
            
            step = 0;
            renderStep();
        });

        (() => {
            updateLanguageSelector();
            updateCharacterSelector();
        })();
    </script>
</body>
</html>
