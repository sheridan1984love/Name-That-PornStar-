<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>صندوق الموسم</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            background: linear-gradient(145deg, #0084ff, #0066cc);
            overflow: hidden;
            font-family: 'Cairo', sans-serif;
            position: relative;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        /* تأثير الأشعة خلف الصندوق */
        .sun-background {
            position: absolute;
            width: 200vh; height: 200vh;
            background: repeating-conic-gradient(
                from 0deg,
                rgba(255, 255, 255, 0.15) 0deg 15deg,
                transparent 15deg 30deg
            );
            animation: rotate 20s linear infinite;
            z-index: 1;
        }

        @keyframes rotate { to { transform: rotate(360deg); } }

        /* طبقة الفلاش الأبيض */
        .flash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.1s ease;
        }
        .flash.active { opacity: 1; }

        /* زر الاحتمالات */
        .probabilities-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: #c49a7c;
            border: 4px solid #4e3421;
            border-radius: 25px;
            padding: 8px 18px;
            cursor: pointer;
            z-index: 15;
            box-shadow: 0 4px 0 #4e3421;
            transition: all 0.1s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .probabilities-btn.hidden {
            display: none;
        }

        .probabilities-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #4e3421;
        }

        .probabilities-btn span {
            font-size: 14px;
            font-weight: bold;
            color: #4e3421;
        }

        /* نافذة الاحتمالات */
        .probabilities-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex; justify-content: center; align-items: center;
            z-index: 100;
            opacity: 0; visibility: hidden;
            transition: all 0.3s ease;
        }
        .probabilities-overlay.active { opacity: 1; visibility: visible; }

        .probabilities-card {
            width: 92%;
            max-width: 400px;
            background-color: #c49a7c;
            border: 6px solid #4e3421;
            border-radius: 25px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .probabilities-overlay.active .probabilities-card { transform: scale(1); }

        .modal-header { text-align: center; margin-bottom: 15px; }
        .modal-title { font-size: 24px; font-weight: 900; color: #4e3421; margin-bottom: 5px; }

        .modal-subtitle {
            display: flex; align-items: center; justify-content: center;
            gap: 10px; font-size: 18px; color: #fff;
            background: #4e3421; padding: 5px 15px; border-radius: 20px;
        }
        .modal-subtitle img { width: 30px; height: 30px; }

        /* شبكة الجوائز */
        .rewards-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            width: 100%;
        }

        .reward-item {
            background: #a67c52;
            border: 3px solid #4e3421;
            border-radius: 15px;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .reward-icon-container {
            background: #4e3421;
            border-radius: 10px;
            width: 55px; height: 55px;
            display: flex; justify-content: center; align-items: center;
            flex-shrink: 0;
        }
        .reward-icon-container img { width: 40px; height: 40px; object-fit: contain; }

        .reward-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .reward-name { font-size: 14px; font-weight: bold; color: #fff; }
        .reward-qty { font-size: 12px; color: #ffe0b3; font-weight: bold; }
        .reward-chance { font-size: 13px; font-weight: bold; color: #ffd700; }

        .game-wrapper {
            position: relative;
            z-index: 2;
            text-align: center;
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        /* الصندوق */
        .box-img {
            width: 180px;
            height: auto;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: float 2.5s ease-in-out infinite;
            display: block;
            margin: 0 auto;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.3));
            -webkit-tap-highlight-color: transparent;
        }

        .box-img:active {
            transform: scale(0.9);
            animation: none;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* الجائزة - بدون بوردات */
        .prize {
            position: absolute;
            top: 60%; left: 50%;
            transform: translate(-50%, -50%) scale(0);
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: 250px;
            text-align: center;
            pointer-events: none;
            z-index: 10;
            background: transparent;
        }

        .prize-img {
            width: 140px;
            height: 140px;
            object-fit: contain;
            margin-bottom: 20px;
            animation: prizePop 0.5s ease-out;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.3));
        }

        @keyframes prizePop {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }

        .prize-name {
            font-size: 28px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            margin-bottom: 10px;
        }

        .prize-amount {
            font-size: 32px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        /* عند الفتح */
        .opened .box-img { 
            transform: scale(0); 
            opacity: 0; 
            pointer-events: none; 
            animation: none;
        }
        .opened .prize { 
            transform: translate(-50%, -50%) scale(1); 
            opacity: 1; 
        }
        .opened .instruction { 
            opacity: 0; 
        }

      .instruction {
    color: white;
    font-weight: bold;
    margin-top: 30px;
    font-size: 18px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    display: inline-block;
    pointer-events: none;
    animation: pulse 1.2s ease-in-out infinite;
    position: relative;
    top: 100px;  /* غيّر هذه القيمة لتحريك النص فقط */
}

@keyframes pulse {
    0%, 100% {
        transform: scale(1);
    }
    50% {
        transform: scale(1.08);
    }
}
        /* طبقة العودة */
        .return-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            z-index: 25;
            display: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="sun-background"></div>

    <!-- طبقة الفلاش الأبيض -->
    <div class="flash" id="flash"></div>

    <!-- طبقة العودة (تظهر بعد فتح الصندوق) -->
    <div class="return-layer" id="returnLayer" onclick="closeWindow()"></div>

    <!-- زر الاحتمالات -->
    <div class="probabilities-btn" id="probabilitiesBtn">
        <span>الاحتمالات</span>
    </div>

    <!-- نافذة الاحتمالات -->
    <div id="probabilitiesOverlay" class="probabilities-overlay" onclick="closeProbabilities()">
        <div class="probabilities-card" onclick="event.stopPropagation()">
            <div class="modal-header">
                <div class="modal-title">نسب الجوائز</div>
                <div class="modal-subtitle">
                    <img src="Box1.png" alt="صندوق">
                    <span>الصندوق الموسمي</span>
                </div>
            </div>

            <!-- شبكة الجوائز -->
            <div class="rewards-grid" id="rewardsGrid"></div>
        </div>
    </div>

    <div class="game-wrapper" id="game">
        <img src="Box1.png" class="box-img" id="boxImg">

        <div class="prize" id="prize">
            <img id="prizeImg" class="prize-img" src="">
            <div class="prize-name" id="prizeName"></div>
            <div class="prize-amount" id="prizeAmount"></div>
        </div>

        <div class="instruction">اضغط لفتح الصندوق</div>
    </div>

    <script>
        // تعريف الفئات الرئيسية للجوائز (6 فئات)
        const rewardsList = [
            { name: 'أموال', img: 'https://i.ibb.co/N6GXqGpk/Money.png', qty: '250 - 1000', percent: '30%' },
            { name: 'ألماس', img: 'https://i.ibb.co/KjKrKK3T/1774202167159.png', qty: '10 - 50', percent: '10%' },
            { name: 'محاصيل', img: 'https://i.ibb.co/HTTNdRkP/wheat.png', qty: '5 - 20', percent: '20%' },
            { name: 'منتجات', img: 'https://i.ibb.co/gbMXS0Yg/Egg.png', qty: '5 - 20', percent: '20%' },
            { name: 'قدرات', img: 'https://i.ibb.co/your-speed-icon.png', qty: '1 - 3', percent: '15%' },
            { name: 'تذاكر ذهبية', img: 'https://i.ibb.co/TDvVfxxb/Teket.png', qty: '5', percent: '5%' }
        ];

        // بناء شبكة الجوائز
        function buildRewardsGrid() {
            const grid = document.getElementById('rewardsGrid');
            grid.innerHTML = '';

            rewardsList.forEach(reward => {
                const item = document.createElement('div');
                item.className = 'reward-item';
                item.innerHTML = `
                    <div class="reward-icon-container">
                        <img src="${reward.img}" alt="${reward.name}">
                    </div>
                    <div class="reward-info">
                        <div class="reward-name">${reward.name}</div>
                        <div class="reward-qty">${reward.qty}</div>
                        <div class="reward-chance">${reward.percent}</div>
                    </div>
                `;
                grid.appendChild(item);
            });
        }

        // تعريف المحاصيل
        const crops = [
            { name: 'قمح', img: 'https://i.ibb.co/HTTNdRkP/wheat.png' },
            { name: 'ذرة', img: 'https://i.ibb.co/67RPHStB/corn.png' },
            { name: 'طماطم', img: 'https://i.ibb.co/WpMcRBFD/tomatoes.png' },
            { name: 'بطاطا', img: 'https://i.ibb.co/wNznZ239/potatoes.png' },
            { name: 'جزر', img: 'https://i.ibb.co/Ldm1M39x/carrot.png' },
            { name: 'باذنجان', img: 'https://i.ibb.co/PvVmPj4Q/eggplant.png' },
            { name: 'فراولة', img: 'https://i.ibb.co/93Vzw8gp/Strawberry.png' },
            { name: 'عنب', img: 'https://i.ibb.co/wXXGJpd/grapes.png' },
            { name: 'خيار', img: 'https://i.ibb.co/0jVwdxGT/cucumber.png' },
            { name: 'بروكلي', img: 'https://i.ibb.co/S4k8BQDT/broccoli.png' },
            { name: 'فلفل', img: 'https://i.ibb.co/B5bpYf0h/Pepper.png' },
            { name: 'رمان', img: 'https://i.ibb.co/Pzbd4vMZ/pomegranate.png' },
            { name: 'مانجو', img: 'https://i.ibb.co/QjfmCPw2/mango.png' },
            { name: 'بطيخ', img: 'https://i.ibb.co/KYhqzX6/watermelon.png' },
            { name: 'يقطين', img: 'https://i.ibb.co/RT96VT9g/pumpkin.png' }
        ];

        // تعريف المنتجات
        const products = {
            chicken: { name: 'بيض', img: 'https://i.ibb.co/gbMXS0Yg/Egg.png' },
            sheep: { name: 'صوف', img: 'https://i.ibb.co/Y4SxJ6SP/1773562765337.png' },
            cow: { name: 'حليب', img: 'https://i.ibb.co/2YCB7dq0/1773562787884.png' }
        };

        // تعريف القدرات
        const abilities = {
            speed: { name: 'النمو السريع', img: 'https://i.ibb.co/your-speed-icon.png' },
            double: { name: 'النضج الجيد', img: 'https://i.ibb.co/your-double-icon.png' },
            instant: { name: 'موسم الحصاد', img: 'https://i.ibb.co/your-instant-icon.png' }
        };

        // أعداد الجوائز
        const moneyAmounts = [250, 500, 1000];
        const diamondAmounts = [10, 20, 50];
        const cropAmounts = [5, 10, 20];
        const productAmounts = [5, 10, 15, 20];
        const abilityAmounts = [1, 2, 3];
        const ticketAmounts = [5];

        let isOpened = false;
        let preventClick = false;

        // دوال الاحتمالات
        const probabilitiesOverlay = document.getElementById('probabilitiesOverlay');
        const probabilitiesBtn = document.getElementById('probabilitiesBtn');

        function openProbabilities() {
            probabilitiesOverlay.classList.add('active');
            preventClick = true;
        }

        function closeProbabilities() {
            probabilitiesOverlay.classList.remove('active');
            setTimeout(() => {
                preventClick = false;
            }, 300);
        }

        probabilitiesBtn.onclick = (e) => {
            e.stopPropagation();
            openProbabilities();
        };

        // دالة اختيار عشوائي حسب الوزن
        function weightedRandom(weights) {
            let total = 0;
            for (let w of weights) total += w;
            let random = Math.random() * total;
            let cumulative = 0;
            for (let i = 0; i < weights.length; i++) {
                cumulative += weights[i];
                if (random < cumulative) return i;
            }
            return 0;
        }

        function randomChoice(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        // دالة اختيار الجائزة
        function getRandomReward() {
            const categories = [
                { type: 'money', weight: 30 },
                { type: 'diamond', weight: 10 },
                { type: 'crop', weight: 20 },
                { type: 'product', weight: 20 },
                { type: 'ability', weight: 15 },
                { type: 'ticket', weight: 5 }
            ];

            const categoryIndex = weightedRandom(categories.map(c => c.weight));
            const category = categories[categoryIndex].type;

            switch(category) {
                case 'money':
                    return {
                        type: 'money',
                        amount: randomChoice(moneyAmounts),
                        img: 'https://i.ibb.co/N6GXqGpk/Money.png',
                        name: 'عملات'
                    };
                case 'diamond':
                    return {
                        type: 'diamond',
                        amount: randomChoice(diamondAmounts),
                        img: 'https://i.ibb.co/KjKrKK3T/1774202167159.png',
                        name: 'ألماس'
                    };
                case 'crop':
                    const randomCrop = randomChoice(crops);
                    return {
                        type: 'crop',
                        cropName: randomCrop.name,
                        amount: randomChoice(cropAmounts),
                        img: randomCrop.img,
                        name: randomCrop.name
                    };
                case 'product':
                    const productWeights = [10, 5, 5];
                    const productTypes = ['chicken', 'sheep', 'cow'];
                    const productIndex = weightedRandom(productWeights);
                    const productType = productTypes[productIndex];
                    const product = products[productType];
                    return {
                        type: 'product',
                        productType: productType,
                        amount: randomChoice(productAmounts),
                        img: product.img,
                        name: product.name
                    };
                case 'ability':
                    const abilityWeights = [10, 3, 2];
                    const abilityTypes = ['speed', 'double', 'instant'];
                    const abilityIndex = weightedRandom(abilityWeights);
                    const abilityType = abilityTypes[abilityIndex];
                    const ability = abilities[abilityType];
                    return {
                        type: 'ability',
                        abilityType: abilityType,
                        amount: randomChoice(abilityAmounts),
                        img: ability.img,
                        name: ability.name
                    };
                case 'ticket':
                    return {
                        type: 'ticket',
                        amount: randomChoice(ticketAmounts),
                        img: 'https://i.ibb.co/TDvVfxxb/Teket.png',
                        name: 'تذاكر ذهبية'
                    };
                default:
                    return {
                        type: 'money',
                        amount: 250,
                        img: 'https://i.ibb.co/N6GXqGpk/Money.png',
                        name: 'عملات'
                    };
            }
        }

        function sendRewardToParent(reward) {
            localStorage.setItem('boxReward', JSON.stringify(reward));
            localStorage.setItem('boxRewardTimestamp', Date.now().toString());
        }

        function displayReward(reward) {
            const prizeImg = document.getElementById('prizeImg');
            const prizeName = document.getElementById('prizeName');
            const prizeAmount = document.getElementById('prizeAmount');

            prizeImg.src = reward.img;
            prizeName.textContent = reward.name;
            prizeAmount.textContent = `+${reward.amount}`;
        }

        function closeWindow() {
            window.location.href = 'index.html';
        }

        function playFlash() {
            const flash = document.getElementById('flash');
            flash.classList.add('active');
            setTimeout(() => {
                flash.classList.remove('active');
            }, 150);
        }

        function openBox() {
            if (isOpened) return;

            playFlash();
            const reward = getRandomReward();

            setTimeout(() => {
                displayReward(reward);
                sendRewardToParent(reward);

                const gameWrapper = document.getElementById('game');
                gameWrapper.classList.add('opened');
                isOpened = true;

                probabilitiesBtn.classList.add('hidden');

                const returnLayer = document.getElementById('returnLayer');
                returnLayer.style.display = 'block';
            }, 150);
        }

        // الضغط في أي مكان على الشاشة يفتح الصندوق
        document.body.onclick = (e) => {
            if (!probabilitiesOverlay.classList.contains('active') && !isOpened && !preventClick) {
                openBox();
            }
        };

        buildRewardsGrid();
    </script>
</body>
</html>
