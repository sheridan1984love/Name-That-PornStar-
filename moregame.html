    <title>menu</title>
    <style>
        @font-face {
            font-family: 'LocalBubble';
            src: url('Menu/bubble.ttf') format('truetype');
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            background-color: #000000; 
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-sizing: border-box;
            position: relative;
            
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            touch-action: none; 
            
            -webkit-tap-highlight-color: transparent; 
        }

        .game-wrapper {
            position: relative;
            width: calc(100vh * (16 / 9));
            height: 100vh;
            max-width: 100%;
            max-height: calc(100vw * (9 / 16));
            box-sizing: border-box;
            overflow: hidden;
        }

        .bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: fill;
            z-index: 1;
            pointer-events: none;
            mix-blend-mode: normal;
            transition: opacity 0.5s ease-in-out;
            opacity: 1;
            transform: scaleX(-1);
            -webkit-transform: scaleX(-1);
        }

        .left-sidebar {
            position: absolute;
            top: 0;
            left: 0; 
            width: 27% !important;
            height: 100%;
            background-color: #FFB6C1;
            z-index: 5;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }
        
        .top-image {
            position: absolute;
            left: 50%;
            top: 3%;
            transform: translateX(-50%);
            width: 80%;
            height: auto;
            z-index: 10;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
        }

        .menu-container {
            position: absolute;
            left: 50%;
            top: 60%; 
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 10;
            width: 85%;
            align-items: center;
        }

        .menu-item {
            width: 90%; 
            padding: 5%; 
            background-color: #FFC0CB; 
            border: 3px solid #C71585;    
            border-radius: 6px;
            color: #C71585;               
            font-family: 'LocalBubble', sans-serif;
            font-size: 2vw;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
            box-sizing: border-box;
            transition: background-color 0.2s ease, color 0.2s ease, transform 0.1s ease;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

       .menu-item:active {
    background-color: #C71585;
    color: #ffffff;
    transform: scale(1.05);
}


        .falling-heart {
            position: absolute;
            top: -10%;
            z-index: 6;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
            animation: fall linear forwards;
        }

        @keyframes fall {
            0% {
                top: -10%;
                transform: translateX(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.9;
            }
            90% {
                opacity: 0.9;
            }
            100% {
                top: 110%;
                transform: translateX(15px) rotate(20deg);
                opacity: 0;
            }
        }

        function checkFileSize(file) {

        function checkAvatarCooldown() {
            const lastUpload = localStorage.getItem('moc_last_avatar_upload');
            if (lastUpload) {
                const elapsed = Date.now() - parseInt(lastUpload);
                if (elapsed < AVATAR_COOLDOWN) {
                    const hoursLeft = Math.ceil((AVATAR_COOLDOWN - elapsed) / (60 * 60 * 1000));
                    showFloatingNotification('You can change avatar again in ' + hoursLeft + ' hours');
                    return false;
                }
            }
            return true;
        }

        async function uploadToImgBB(imageData) {
            const url = "https://api.imgbb.com/1/upload";
            try {
                const formData = new FormData();
                formData.append('key', IMGBB_API_KEY);
                formData.append('image', imageData);
                const response = await fetch(url, { method: 'POST', body: formData });
                const result = await response.json();
                if (result.success) {
                    return result.data.url;
                } else {
                    console.error('ImgBB upload error:', result.error);
                    return null;
                }
            } catch (error) {
                console.error('Upload error:', error);
                return null;
            }
        }

        function loadAvatarWithPlaceholder(imgElement, imageUrl) {
            if (!imgElement) return;
            imgElement.src = 'Menu/lode.gif';
            imgElement.style.opacity = '1';
            imgElement.classList.add('loading');
            imgElement.classList.remove('loaded', 'failed');
            const tempImg = new Image();
            tempImg.onload = function() {
                imgElement.src = imageUrl;
                imgElement.style.opacity = '1';
                imgElement.classList.remove('loading');
                imgElement.classList.add('loaded');
            };
            tempImg.onerror = function() {
                imgElement.src = 'Menu/fail.png';
                imgElement.style.opacity = '1';
                imgElement.classList.remove('loading');
                imgElement.classList.add('failed');
            };
            tempImg.src = imageUrl;
        }

        function loadAvatarFromLocal() {
            const savedAvatar = localStorage.getItem('moc_avatar');
            const avatarElement = document.getElementById('profileAvatar');
            const singBtnElement = document.getElementById('singBtn');
            if (savedAvatar && savedAvatar !== '' && savedAvatar !== 'null') {
                loadAvatarWithPlaceholder(avatarElement, savedAvatar);
                if (singBtnElement) {
                    loadAvatarWithPlaceholder(singBtnElement.querySelector('img'), savedAvatar);
                }
            } else {
                if (avatarElement) {
                    avatarElement.src = 'Menu/sing.png';
                    avatarElement.style.opacity = '1';
                    avatarElement.classList.remove('loading');
                    avatarElement.classList.add('failed');

                        singImg.src = 'Menu/sing.png';
                        singImg.style.opacity = '1';
                        singImg.classList.remove('loading');
                        singImg.classList.add('failed');
                    }
                }
            }
        }

        async function loadAvatarFromFirebaseAndSaveLocal(username) {
            try {
                const querySnapshot = await db.collection('players')
                    .where('name', '==', username)
                    .get();
                if (!querySnapshot.empty) {
                    const data = querySnapshot.docs[0].data();
                    const avatarUrl = data.moc_avatar || '';
                    if (avatarUrl && avatarUrl !== '' && avatarUrl !== 'null') {
                        localStorage.setItem('moc_avatar', avatarUrl);
                        const avatarElement = document.getElementById('profileAvatar');
                        const singBtnElement = document.getElementById('singBtn');
                        loadAvatarWithPlaceholder(avatarElement, avatarUrl);
                        if (singBtnElement) {
                            loadAvatarWithPlaceholder(singBtnElement.querySelector('img'), avatarUrl);
                        }
                        return avatarUrl;
                    } else {
                        localStorage.removeItem('moc_avatar');
                        const avatarElement = document.getElementById('profileAvatar');
                        const singBtnElement = document.getElementById('singBtn');
                        if (avatarElement) {
                            avatarElement.src = 'Menu/fail.png';
                            avatarElement.style.opacity = '1';
                            avatarElement.classList.remove('loading');
                            avatarElement.classList.add('failed');
                        }
                        if (singBtnElement) {
                            const singImg = singBtnElement.querySelector('img');
                            if (singImg) {
                                singImg.src = 'Menu/fail.png';
                                singImg.style.opacity = '1';
                                singImg.classList.remove('loading');
                                singImg.classList.add('failed');
                            }
                        }
                    }
                }
                return null;
            } catch (error) {
                console.error('Error loading avatar:', error);
                return null;

        async function uploadAvatarAndSaveToFirebase(file) {
            if (!currentUser) {
                showFloatingNotification('Please login first');
                return;
            }

            
            if (!checkFileSize(file)) {
                return;
            }
            
            if (!checkAvatarCooldown()) {
                return;
            }

            try {
                const reader = new FileReader();
                reader.onload = async function(e) {
                    const imageData = e.target.result.split(',')[1];
                    showFloatingNotification('Uploading...');
                    const avatarElement = document.getElementById('profileAvatar');
                    const singBtnElement = document.getElementById('singBtn');
                    if (avatarElement) {
                        avatarElement.src = 'Menu/lode.gif';
                        avatarElement.style.opacity = '1';
                        avatarElement.classList.add('loading');
                        avatarElement.classList.remove('loaded', 'failed');
                    }
                    const imageUrl = await uploadToImgBB(imageData);
                    if (!imageUrl) {
                        if (avatarElement) {
                            avatarElement.src = 'Menu/fail.png';
                            avatarElement.style.opacity = '1';
                            avatarElement.classList.remove('loading');
                            avatarElement.classList.add('failed');
                        }
                        showFloatingNotification('Failed to upload image');
                        return;
                    }
                    const querySnapshot = await db.collection('players')
                        .where('name', '==', currentUser)
                        .get();
                    if (!querySnapshot.empty) {
                        const docId = querySnapshot.docs[0].id;
                        await db.collection('players').doc(docId).update({
                            moc_avatar: imageUrl,
                            lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
                        });
                        localStorage.setItem('moc_avatar', imageUrl);
                        localStorage.setItem('moc_last_avatar_upload', Date.now().toString());
                        if (avatarElement) {
                            loadAvatarWithPlaceholder(avatarElement, imageUrl);
                        }
                        if (singBtnElement) {
                            loadAvatarWithPlaceholder(singBtnElement.querySelector('img'), imageUrl);
                        }
                        showFloatingNotification('Avatar updated successfully!');
                    }
                };
                reader.readAsDataURL(file);
            } catch (error) {
                console.error('Error:', error);
                showFloatingNotification('Error uploading avatar');
                const avatarElement = document.getElementById('profileAvatar');
                if (avatarElement) {
                    avatarElement.src = 'Menu/fail.png';
                    avatarElement.style.opacity = '1';
                    avatarElement.classList.remove('loading');
                    avatarElement.classList.add('failed');
                }
            }
        }

        async function saveDataToFirebase() {
            if (!currentUser) return;
            const hearts = parseInt(localStorage.getItem('moc_count')) || 0;

            const boosterLevels = localStorage.getItem('moc_booster_levels') || '[]';

            const continuousLoveUpgradeLevel = parseInt(localStorage.getItem('moc_continuouslove_upgrade_level')) || 0;
            
            try {
                const querySnapshot = await db.collection('players')
                    .where('name', '==', currentUser)
                    .get();
                if (!querySnapshot.empty) {
                    const docId = querySnapshot.docs[0].id;
                    await db.collection('players').doc(docId).update({
                        moc_hearts: hearts,
                        moc_level: level,
                        moc_booster_levels: boosterLevels,

                        lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    console.log('Data saved to Firebase - Hearts:', hearts, 'Level:', level);
                }
            } catch (error) {
                console.error('Error saving data:', error);
            }
        }

        async function loadDataFromFirebase(username) {
            try {
                const querySnapshot = await db.collection('players')
                    .where('name', '==', username)
                    .get();
                if (!querySnapshot.empty) {
                    const data = querySnapshot.docs[0].data();
                    
                    const hearts = data.moc_hearts || 0;
                    const level = data.moc_level || 0;
                    localStorage.setItem('moc_count', hearts);
                    localStorage.setItem('moc_last_index', level);
                    
                    if (data.moc_booster_levels) {
                        localStorage.setItem('moc_booster_levels', data.moc_booster_levels);
                    }
                    if (data.moc_daily_limit_level !== undefined) {
                        localStorage.setItem('moc_daily_limit_level', data.moc_daily_limit_level);
                    }
                    if (data.moc_bonus_upgrade_level !== undefined) {
                        localStorage.setItem('moc_bonus_upgrade_level', data.moc_bonus_upgrade_level);
                    }
                    if (data.moc_multiplier_upgrade_level !== undefined) {
                        localStorage.setItem('moc_multiplier_upgrade_level', data.moc_multiplier_upgrade_level);
                    }
                    if (data.moc_boostspeed_upgrade_level !== undefined) {
                        localStorage.setItem('moc_boostspeed_upgrade_level', data.moc_boostspeed_upgrade_level);
                    }
                    if (data.moc_continuouslove_upgrade_level !== undefined) {
                        localStorage.setItem('moc_continuouslove_upgrade_level', data.moc_continuouslove_upgrade_level);
                    }
                    
                    updateProfileHearts();
                    updateProfileLevel();
                    updateHeaderInfo(username);
                    return { hearts, level };

            } catch (error) {

        function formatNumber(num) {
            if (num >= 1000000000) {
                return (num / 1000000000).toFixed(2) + 'B';
            }
            if (num >= 1000000) {
                return (num / 1000000).toFixed(2) + 'M';
            }
            if (num >= 1000) {
                return (num / 1000).toFixed(2) + 'K';
            }
            return num.toString();
        }

            const hearts = parseInt(localStorage.getItem('moc_count')) || 0;

                    showFloatingNotification('Welcome back, ' + username + '!');
                    closeAuthFullscreen();
                    showProfile(username);
                    
                } else {
                    const existing = await db.collection('players')
                        .where('name', '==', username)
                        .get();
                    
                    if (!existing.empty) {
                        showFloatingNotification('Username already exists!');
                        return;
                    }
                    
                    await db.collection('players').add({
                        name: username,
                        password: password,
                        moc_hearts: 0,
                        moc_level: 0,
                        moc_booster_levels: '[]',
                        moc_daily_limit_level: 0,
                        moc_bonus_upgrade_level: 0,
                        moc_multiplier_upgrade_level: 0,
                        moc_boostspeed_upgrade_level: 0,
                        moc_continuouslove_upgrade_level: 0,
                        moc_avatar: '',
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    
                    currentUser = username;
                    localStorage.setItem('moc_logged_in', 'true');
                    localStorage.setItem('moc_username', username);
                    localStorage.setItem('moc_count', 0);
                    localStorage.setItem('moc_last_index', 0);
                    localStorage.setItem('moc_booster_levels', '[]');
                    localStorage.setItem('moc_daily_limit_level', 0);
                    localStorage.setItem('moc_bonus_upgrade_level', 0);
                    localStorage.setItem('moc_multiplier_upgrade_level', 0);
                    localStorage.setItem('moc_boostspeed_upgrade_level', 0);
                    localStorage.setItem('moc_continuouslove_upgrade_level', 0);
                    localStorage.setItem('moc_avatar', '');
                    
                    showFloatingNotification('Account created successfully!');
                    closeAuthFullscreen();
                    showProfile(username);
                }
                
                authUsernameInput.value = '';
                authPasswordInput.value = '';
                
            } catch (error) {
                console.error('Auth error:', error);
                showFloatingNotification('Connection error. Please try again.');
            }
        }

        function showProfile(username) {
            slideshowContent.style.display = 'none';
            profileContainer.classList.add('show');
            profileName.textContent = username || 'User';
            updateProfileHearts();
            updateProfileLevel();
            updateHeaderInfo(username);
            loadAvatarFromLocal();
        }

        function logoutUser() {
            saveDataToFirebase();
            currentUser = null;
            profileContainer.classList.remove('show');
            userInfoBox.classList.remove('show');
            localStorage.removeItem('moc_logged_in');
            localStorage.removeItem('moc_username');
            const singBtnElement = document.getElementById('singBtn');
            if (singBtnElement) {
                const singImg = singBtnElement.querySelector('img');
                if (singImg) {
                    singImg.src = 'Menu/fail.png';
                    singImg.style.opacity = '1';
                    singImg.classList.remove('loading');
                    singImg.classList.add('failed');
                }
            }
            closeSingPopup();
            openAuthFullscreen();
        }

        function checkLoginStatus() {
    const loggedIn = localStorage.getItem('moc_logged_in');
    const username = localStorage.getItem('moc_username');
    if (loggedIn === 'true' && username) {
        currentUser = username;
        loadAvatarFromLocal();
        const hearts = parseInt(localStorage.getItem('moc_count')) || 0;
        const level = (parseInt(localStorage.getItem('moc_last_index')) || 0) + 1;
        updateProfileHearts();
        updateProfileLevel();
        updateHeaderInfo(username);
        return true;
    }
    return false;
}

        function openSingPopup() {
            singPopup.classList.add('active');
            if (checkLoginStatus()) {
                showProfile(localStorage.getItem('moc_username'));
                return;
            }
            closeSingPopup();
            openAuthFullscreen();
        }

        function closeSingPopup() {
            singPopup.classList.remove('active');
            isSlideshowActive = false;
            canClick = false;
        }

        function updateSlideWithAnimation() {
            singPopupImage.classList.remove('show');
            singPopupText.classList.remove('show');
            singPopupImage.classList.add('hide');
            singPopupText.classList.add('hide');
            setTimeout(() => {
                if (slideIndex < slides.length) {
                    singPopupImage.src = slides[slideIndex].image;
                    singPopupText.textContent = slides[slideIndex].text;
                    clickHint.style.display = (slideIndex < slides.length - 1) ? 'block' : 'block';
                    singPopupImage.classList.remove('hide');
                    singPopupText.classList.remove('hide');
                    setTimeout(() => {
                        singPopupImage.classList.add('show');
                        singPopupText.classList.add('show');
                    }, 50);
                }
            }, 300);
        }

        singPopupCard.addEventListener('click', function(e) {
            if (e.target.classList.contains('sing-popup-close-btn')) return;
            if (e.target.closest('.profile-container')) return;
            if (e.target.closest('.profile-avatar')) return;
            if (e.target.closest('.profile-upload-hint')) return;
            if (e.target.closest('.profile-btn')) return;
            if (e.target.closest('#avatarInput')) return;
            if (!canClick || !isSlideshowActive) return;
            
            slideIndex++;
            if (slideIndex >= slides.length) {
                slideshowContent.style.display = 'none';
                isSlideshowActive = false;
                if (!checkLoginStatus()) {
                    closeSingPopup();
                    openAuthFullscreen();
                }
            } else {
                canClick = false;
                updateSlideWithAnimation();
                setTimeout(() => { canClick = true; }, 2500);
            }
        });

        function showFloatingNotification(message) {
            const notif = document.createElement('div');
            notif.style.cssText = `
                position: absolute;
                top: 35%;
                left: 50%;
                transform: translateX(-50%);
                color: #FFFFFF;
                font-family: 'LocalBubble', sans-serif;
                font-size: 2.5vw;
                font-weight: bold;
                text-align: center;
                z-index: 5000;
                pointer-events: none;
                white-space: nowrap;
                text-shadow: 0.1vw 0.1vw 0.15vw #808080, -0.1vw -0.1vw 0.15vw #808080;
                animation: floatUpNotif 1s ease-out forwards;
            `;
            notif.textContent = message;
            document.querySelector('.game-wrapper').appendChild(notif);
            setTimeout(() => { notif.remove(); }, 3000);
        }

        function createHeart() {
            const heart = document.createElement('img');
            const randomSrc = heartImages[Math.floor(Math.random() * heartImages.length)];
            heart.src = randomSrc;
            heart.classList.add('falling-heart');
            const randomLeft = Math.random() * 90; 
            const randomSize = Math.random() * 20 + 15; 
            const randomDuration = Math.random() * 3.9 + 2.6; 
            heart.style.left = `${randomLeft}%`;
            heart.style.width = `${randomSize}px`;
            heart.style.height = 'auto';
            heart.style.animationDuration = `${randomDuration}s`;
            sidebar.appendChild(heart);
            setTimeout(() => { heart.remove(); }, randomDuration * 1000);
        }

        setInterval(createHeart, 500);

function enableAudioOnFirstTouch() {
    if (!bgMusic) {
        bgMusic = new Audio('Menu/mbg.mp3');
        bgMusic.loop = true;
        bgMusic.volume = musicVolume;
        bgMusic.play().catch(err => console.log("Music play error:", err));
    }
}

enableAudioOnFirstTouch();

        bgVideo.addEventListener('timeupdate', () => {
            const buffer = 0.4;
            if (bgVideo.duration && (bgVideo.currentTime >= bgVideo.duration - buffer)) {
                bgVideo.style.opacity = '0.7';
            } else {
                bgVideo.style.opacity = '1';
            }
        });

        bgVideo.addEventListener('seeked', () => {
            bgVideo.style.opacity = '1';
        });

        function updateSliderBackground(slider) {
            const percentage = ((slider.value - slider.min) / (slider.max - slider.min)) * 100;
            slider.style.setProperty('--value', percentage + '%');
        }

        function openSettings() {
            sfxSlider.value = sfxVolume;
            musicSlider.value = musicVolume;
            updateSliderBackground(sfxSlider);
            updateSliderBackground(musicSlider);
            settingsPopup.classList.add('active');
        }

        function closeSettings() {
            settingsPopup.classList.remove('active');
        }

        sfxSlider.addEventListener('input', (e) => {
            sfxVolume = parseFloat(e.target.value);
            updateSliderBackground(e.target);
            localStorage.setItem('moc_sfx_volume', sfxVolume);
        });

        musicSlider.addEventListener('input', (e) => {
            musicVolume = parseFloat(e.target.value);
            updateSliderBackground(e.target);
            localStorage.setItem('moc_music_volume', musicVolume);
            if (bgMusic) {
                bgMusic.volume = musicVolume;
            }
        });

        function openStory() {
            const playerLevel = parseInt(localStorage.getItem('moc_last_index')) || 0;
            if (playerLevel >= 5) {
                appBtn.style.transform = 'scale(0.85)';
                setTimeout(() => { appBtn.style.transform = 'scale(1)'; }, 300);
                navigateTo('story.html');
            } else {
                showFloatingNotification('You need to reach level 5 to unlock');
            }
        }

        function navigateTo(url) {
            if (bgMusic) {
                bgMusic.pause();
                bgMusic = null;
            }
            fadeTransition.classList.add('active');
            setTimeout(() => { window.location.href = url; }, 500);
        }
        
// ===== نظام تحديث البيانات =====
const REFRESH_COOLDOWN = 24 * 60 * 60 * 1000; // 24 ساعة

async function refreshData() {
    // التحقق من وقت آخر تحديث
    const lastRefresh = localStorage.getItem('moc_last_refresh_time');
    if (lastRefresh) {
        const elapsed = Date.now() - parseInt(lastRefresh);
        if (elapsed < REFRESH_COOLDOWN) {
            const hoursLeft = Math.ceil((REFRESH_COOLDOWN - elapsed) / (60 * 60 * 1000));
            showFloatingNotification('You can refresh again in ' + hoursLeft + ' hours');
            return;
        }
    }
    
    if (!currentUser) {
        showFloatingNotification('Please login first');
        return;
    }
    
    try {
        showFloatingNotification('Refreshing data...');
        await saveDataToFirebase();
        const data = await loadDataFromFirebase(currentUser);
        
        // تحديث العرض
        updateProfileHearts();
        updateProfileLevel();
        updateHeaderInfo(currentUser);
        
        // حفظ وقت التحديث
        localStorage.setItem('moc_last_refresh_time', Date.now().toString());
        
        showFloatingNotification('Data refreshed successfully!');
    } catch (error) {
        console.error('Refresh error:', error);
        showFloatingNotification('Failed to refresh data');
    }
}

            confirmResetPopup.classList.add('show');

        function closeConfirmReset() {

        }

        openAuthFullscreen();

        function showConfirmModal() {
            confirmOverlay.classList.add('show');
        }

        function hideConfirmModal(event) {
            if (event) event.stopPropagation(); 
            confirmOverlay.classList.remove('show');
        }

            if (event) event.stopPropagation(); 
            confirmOverlay.classList.remove('show');

                bgMusic.pause();
                bgMusic = null;
            }
            window.close();
            try {
                window.location.href = 'about:blank';
            } catch(e) {
                console.log("Exit: ", e);

        function handleMenuClick(action) {
            if (action === 'Play') {
                navigateTo('game.html');

                navigateTo('moregame.html');
            }

        authUsernameInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                authPasswordInput.focus();
            }
        });

                handleAuthFullscreenLogin();
            }
        });

        setInterval(() => {
    if (currentUser) {
        const hearts = parseInt(localStorage.getItem('moc_count')) || 0;
        const level = (parseInt(localStorage.getItem('moc_last_index')) || 0) + 1; 
        profileHearts.textContent = formatNumber(hearts);
        profileLevel.textContent = 'Lv.' + level;
        headerLevel.textContent = 'Lv.' + level;

}, 5000);

        setInterval(() => {
            if (currentUser) {
                saveDataToFirebase();
            }
        }, 43200000);

        const style = document.createElement('style');
        style.textContent = `
            @keyframes floatUpNotif {
                0% { transform: translate(-50%, 60%) scale(0.8); opacity: 0; } 
                15% { opacity: 1; }
                70% { opacity: 1; }
                100% { transform: translate(-50%, -100%) scale(0.95); opacity: 0; }
            }
        `;
        document.head.appendChild(style);

        const storedSfx = localStorage.getItem('moc_sfx_volume');
        if (storedSfx !== null && !isNaN(parseFloat(storedSfx))) {
            sfxVolume = parseFloat(storedSfx);
        }

        const storedMusic = localStorage.getItem('moc_music_volume');
        if (storedMusic !== null && !isNaN(parseFloat(storedMusic))) {
            musicVolume = parseFloat(storedMusic);
        }

        window.addEventListener('load', function() {
            loadAvatarFromLocal();
            if (!checkLoginStatus()) {
                openAuthFullscreen();
            } else {
                const username = localStorage.getItem('moc_username');
                if (username) {
                    loadAvatarFromLocal();
                    const hearts = parseInt(localStorage.getItem('moc_count')) || 0;
                    const level = parseInt(localStorage.getItem('moc_last_index')) || 0;
                    updateProfileHearts();
                    updateProfileLevel();
                    updateHeaderInfo(username);
                }
            }
